<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CPA 用量自助页</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f4;
      --panel: #ffffff;
      --ink: #20231f;
      --muted: #666d62;
      --line: #dfe4dc;
      --brand: #0f7b63;
      --brand-weak: #e6f3ef;
      --warn: #a26712;
      --danger: #b3261e;
      --ok: #176b45;
      --soft: #eef1eb;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }
    h1, h2, p { margin: 0; }
    h1 { font-size: 26px; font-weight: 720; }
    h2 { font-size: 16px; font-weight: 700; }
    .muted { color: var(--muted); }
    .login {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 18px;
    }
    .login input {
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 11px 12px;
      background: #fff;
      color: var(--ink);
    }
    .btn {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: var(--brand);
      color: white;
      cursor: pointer;
      min-height: 40px;
      white-space: nowrap;
    }
    .btn.secondary {
      background: var(--soft);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-width: 0;
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 8px;
    }
    .value {
      font-size: 24px;
      font-weight: 720;
      overflow-wrap: anywhere;
    }
    .section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      font-size: 12px;
      background: var(--soft);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip.ok { color: var(--ok); background: #e8f5ed; }
    .chip.bad { color: var(--danger); background: #fbe9e7; }
    .chip.warn { color: var(--warn); background: #fff2dc; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 840px;
    }
    th, td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      font-size: 13px;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      background: #fafbf8;
      font-weight: 650;
    }
    td { overflow-wrap: anywhere; }
    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }
    .progress {
      height: 8px;
      background: var(--soft);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar {
      height: 100%;
      width: 0;
      background: var(--brand);
    }
    .hidden { display: none !important; }
    .error {
      color: var(--danger);
      font-size: 13px;
      padding-top: 8px;
    }
    @media (max-width: 820px) {
      .shell { padding: 16px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .login { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
      .value { font-size: 20px; }
    }
    @media (max-width: 460px) {
      .grid { grid-template-columns: 1fr; }
      .section-head { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div>
        <h1>CPA 用量自助页</h1>
        <p class="muted">用自己的 API Key 登录，只查看自己的限额、用量和最近请求。</p>
      </div>
      <div class="toolbar">
        <span id="liveChip" class="chip warn">实时未连接</span>
        <button id="logoutBtn" class="btn secondary hidden" type="button">退出</button>
      </div>
    </div>

    <form id="loginForm" class="login">
      <div>
        <input id="apiKeyInput" type="password" autocomplete="off" placeholder="粘贴你的 cpa_... API Key">
        <div id="loginError" class="error hidden"></div>
      </div>
      <button class="btn" type="submit">登录查看</button>
    </form>

    <section id="dashboard" class="hidden">
      <div class="grid">
        <div class="card">
          <div class="label">Key 状态</div>
          <div id="keyStatus" class="value">-</div>
          <div id="keyMeta" class="muted"></div>
        </div>
        <div class="card">
          <div class="label">今日用量</div>
          <div id="dailyUsage" class="value">$0.0000</div>
          <div class="progress"><div id="dailyBar" class="bar"></div></div>
        </div>
        <div class="card">
          <div class="label">最近 24 小时请求</div>
          <div id="calls" class="value">0</div>
          <div id="successRate" class="muted">成功率 -</div>
        </div>
        <div class="card">
          <div class="label">Tokens</div>
          <div id="tokens" class="value">0</div>
          <div id="reasoning" class="muted">Reasoning 0</div>
        </div>
      </div>

      <section class="section">
        <div class="section-head">
          <div>
            <h2>模型分布</h2>
            <p class="muted">按当前 Key 的最近 24 小时统计。</p>
          </div>
          <select id="rangeSelect">
            <option value="24h">24 小时</option>
            <option value="7d">7 天</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>模型</th><th>请求</th><th>Tokens</th><th>估算费用</th></tr></thead>
            <tbody id="modelRows"></tbody>
          </table>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <div>
            <h2>最近请求</h2>
            <p class="muted">只显示这个 Key 的请求；失败原因已脱敏。</p>
          </div>
          <button id="refreshBtn" class="btn secondary" type="button">刷新</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th><th>状态</th><th>模型</th><th>延迟</th><th>Tokens</th><th>Reasoning</th><th>费用</th><th>摘要</th>
              </tr>
            </thead>
            <tbody id="eventRows"></tbody>
          </table>
        </div>
        <div id="emptyEvents" class="empty hidden">还没有请求记录。</div>
      </section>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    let stream = null;

    function money(v) {
      const n = Number(v || 0);
      return "$" + n.toFixed(4);
    }
    function num(v) {
      return Number(v || 0).toLocaleString("zh-CN");
    }
    function pct(v) {
      if (v === null || v === undefined) return "-";
      return (Number(v) * 100).toFixed(1) + "%";
    }
    function time(ms) {
      if (!ms) return "-";
      return new Date(Number(ms)).toLocaleString("zh-CN", { hour12: false });
    }
    async function api(path, options = {}) {
      const resp = await fetch(path, {
        credentials: "same-origin",
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options,
      });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        throw new Error(body.error || resp.statusText);
      }
      return resp.json();
    }
    function setLoggedIn(on) {
      $("loginForm").classList.toggle("hidden", on);
      $("dashboard").classList.toggle("hidden", !on);
      $("logoutBtn").classList.toggle("hidden", !on);
    }
    function renderMe(me) {
      $("keyStatus").textContent = me.enabled ? "启用中" : "已停用";
      $("keyMeta").textContent = `${me.name || "未命名"} · ${me.preview || ""} · RPM ${me.rpm || "不限"}`;
    }
    function renderUsage(data, me) {
      const s = data.summary || {};
      $("dailyUsage").textContent = money(s.total_cost);
      const limit = $("rangeSelect").value === "7d" ? me.limits?.weekly_usd : me.limits?.daily_usd;
      const rate = limit ? Math.min(100, Number(s.total_cost || 0) / Number(limit) * 100) : 0;
      $("dailyBar").style.width = rate + "%";
      $("calls").textContent = num(s.total_calls);
      $("successRate").textContent = "成功率 " + pct(s.success_rate);
      $("tokens").textContent = num(s.total_tokens);
      $("reasoning").textContent = "Reasoning " + num(s.reasoning_tokens);

      const rows = (data.model_share || []).map(row => `
        <tr>
          <td>${escapeHtml(row.model || "-")}</td>
          <td>${num(row.calls)}</td>
          <td>${num(row.tokens)}</td>
          <td>${money(row.cost)}</td>
        </tr>`).join("");
      $("modelRows").innerHTML = rows || `<tr><td colspan="4" class="muted">暂无数据</td></tr>`;
    }
    function renderEvents(events) {
      $("emptyEvents").classList.toggle("hidden", events.length > 0);
      $("eventRows").innerHTML = events.map(eventRow).join("");
    }
    function eventRow(ev) {
      const ok = ev.status === "success";
      const chip = ok ? `<span class="chip ok">成功</span>` : `<span class="chip bad">失败</span>`;
      return `<tr>
        <td>${time(ev.timestamp_ms)}</td>
        <td>${chip}</td>
        <td>${escapeHtml(ev.model || "-")}</td>
        <td>${ev.latency_ms == null ? "-" : num(ev.latency_ms) + " ms"}</td>
        <td>${num(ev.total_tokens)}</td>
        <td>${num(ev.reasoning_tokens)}</td>
        <td>${money(ev.cost)}</td>
        <td>${escapeHtml(ev.failure || ev.endpoint || "-")}</td>
      </tr>`;
    }
    function escapeHtml(v) {
      return String(v).replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
    }
    async function refresh() {
      const meData = await api("/api/me");
      renderMe(meData.me);
      const range = $("rangeSelect").value;
      renderUsage(await api(`/api/usage?range=${encodeURIComponent(range)}`), meData.me);
      const ev = await api("/api/events?limit=100");
      renderEvents(ev.events || []);
      setLoggedIn(true);
      startStream();
    }
    function startStream() {
      if (stream) stream.close();
      stream = new EventSource("/api/events/stream", { withCredentials: true });
      stream.addEventListener("ready", () => {
        $("liveChip").textContent = "实时已连接";
        $("liveChip").className = "chip ok";
      });
      stream.addEventListener("event", () => refresh().catch(() => {}));
      stream.addEventListener("error", () => {
        $("liveChip").textContent = "实时重连中";
        $("liveChip").className = "chip warn";
      });
    }
    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginError").classList.add("hidden");
      try {
        await api("/api/session", { method: "POST", body: JSON.stringify({ api_key: $("apiKeyInput").value }) });
        $("apiKeyInput").value = "";
        await refresh();
      } catch (err) {
        $("loginError").textContent = "登录失败：" + err.message;
        $("loginError").classList.remove("hidden");
      }
    });
    $("logoutBtn").addEventListener("click", async () => {
      if (stream) stream.close();
      await api("/api/session", { method: "DELETE" }).catch(() => {});
      setLoggedIn(false);
      $("liveChip").textContent = "实时未连接";
      $("liveChip").className = "chip warn";
    });
    $("refreshBtn").addEventListener("click", () => refresh().catch(() => {}));
    $("rangeSelect").addEventListener("change", () => refresh().catch(() => {}));
    refresh().catch(() => setLoggedIn(false));
  </script>
</body>
</html>
