<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CPA Key Policy+</title>
  <style>{{CSS}}</style>
  <style>
    .admin-shell { width: min(1720px, calc(100% - 32px)); }
    .admin-board {
      display: grid;
      grid-template-columns: minmax(700px, 1fr) minmax(520px, 620px);
      gap: 14px;
      align-items: start;
    }
    .admin-shell .metrics {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .admin-shell .metric {
      min-height: 42px;
      flex: 1 1 190px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 9px 12px;
      border-radius: 8px;
    }
    .admin-shell .metric .label { font-size: 12px; }
    .admin-shell .metric .value { margin-top: 0; font-size: 18px; white-space: nowrap; }
    .admin-shell .metric .hint { display: none; }
    .key-list-table { min-width: 720px; table-layout: fixed; }
    .key-list-table th:nth-child(1) { width: 38%; }
    .key-list-table th:nth-child(2) { width: 18%; }
    .key-list-table th:nth-child(3) { width: 26%; }
    .key-list-table th:nth-child(4) { width: 18%; }
    .key-row { cursor: pointer; }
    .key-row.selected { background: rgba(59, 130, 246, .08); }
    .key-row td { white-space: normal; }
    .key-title { display: grid; gap: 4px; min-width: 0; }
    .key-title strong,
    .key-title small { overflow-wrap: anywhere; }
    .stack { display: grid; gap: 6px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #1a2230;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 720;
      white-space: nowrap;
    }
    .tag.warn { color: #ffd893; border-color: rgba(244, 185, 66, .3); background: var(--amber-soft); }
    .tag.ok { color: #a9f2a2; border-color: rgba(104, 214, 95, .28); background: var(--green-soft); }
    .tag.bad { color: #ffb8b8; border-color: rgba(248, 113, 113, .3); background: var(--red-soft); }
    .tag.soft { color: #a9c8ff; border-color: rgba(59, 130, 246, .28); background: var(--blue-soft); }
    .status-summary { display: grid; gap: 5px; }
    .bar {
      height: 5px;
      margin-top: 7px;
      border-radius: 999px;
      background: #0e1420;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--blue);
    }
    .bar.warn > span { background: var(--amber); }
    .bar.bad > span { background: var(--red); }
    .detail-panel { position: sticky; top: 14px; }
    .detail-body { display: grid; gap: 12px; }
    .detail-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }
    .summary-card {
      min-width: 0;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111722;
    }
    .summary-card small { display: block; margin-bottom: 4px; }
    .summary-card strong { overflow-wrap: anywhere; }
    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .field-grid label,
    .field {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }
    .field-grid .span-2 { grid-column: span 2; }
    .field-grid input,
    .field-grid select { width: 100%; min-width: 0; }
    .quota-editor {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .quota-card {
      display: grid;
      gap: 9px;
      min-width: 0;
      padding: 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111722;
    }
    .quota-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .quota-values {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin: 0;
    }
    .quota-values div { min-width: 0; }
    .quota-values dt {
      color: var(--muted);
      font-size: 11px;
      font-weight: 720;
    }
    .quota-values dd {
      margin: 2px 0 0;
      font-weight: 780;
      overflow-wrap: anywhere;
    }
    .quota-limit-field {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 720;
    }
    .quota-card input { width: 100%; min-width: 0; }
    .model-summary {
      display: grid;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111722;
    }
    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 4px;
    }
    .admin-shell button {
      transform: translateY(0);
      transition: border-color .18s ease, background .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease;
    }
    .admin-shell button:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, .18);
    }
    .admin-shell button:active:not(:disabled) { transform: translateY(0); }
    .admin-shell button.is-busy {
      border-color: rgba(59, 130, 246, .48);
      color: #c8dcff;
    }
    .admin-shell button.is-busy::before {
      content: "";
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 999px;
      animation: spin .72s linear infinite;
    }
    .admin-shell button.is-done {
      border-color: rgba(104, 214, 95, .38);
      background: var(--green-soft);
      color: #a9f2a2;
    }
    .modal-action-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 10, 18, .72);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(980px, 100%);
      max-height: min(88vh, 920px);
      display: flex;
      flex-direction: column;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: #151b27;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .42);
      overflow: hidden;
    }
    .modal-head,
    .modal-foot {
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }
    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }
    .modal-body { padding: 14px; overflow: auto; }
    .selector-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .model-list {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #111722;
      overflow: hidden;
    }
    .model-list-head {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      border-bottom: 1px solid var(--line);
    }
    .model-items { max-height: 390px; overflow: auto; padding: 6px; }
    .model-option {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px;
      border-radius: 7px;
      cursor: pointer;
    }
    .model-option:hover { background: rgba(148, 163, 184, .07); }
    .model-option input { min-height: auto; margin-top: 3px; }
    .model-option strong { font-size: 13px; overflow-wrap: anywhere; }
    .model-meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    .selected-chips { min-height: 34px; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 0 0; }
    .chip-button { border: 0; min-height: 20px; padding: 0 2px; background: transparent; color: inherit; font-weight: 900; }
    .notice {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid rgba(244, 185, 66, .26);
      border-radius: 8px;
      background: var(--amber-soft);
      color: #ffd893;
      font-size: 12px;
    }
    @media (max-width: 1180px) {
      .admin-board { grid-template-columns: 1fr; }
      .detail-panel { position: static; }
    }
    @media (max-width: 820px) {
      .admin-shell { width: min(1800px, calc(100% - 20px)); }
      .field-grid,
      .selector-layout,
      .detail-summary,
      .quota-editor,
      .quota-values { grid-template-columns: 1fr; }
      .field-grid .span-2 { grid-column: auto; }
      .quota-card { grid-template-columns: 1fr; }
      .modal-backdrop { align-items: stretch; padding: 10px; }
      .modal { max-height: calc(100vh - 20px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="shell admin-shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">K+</div>
        <div>
          <h1>CPA Key Policy+</h1>
          <p class="subtitle">Key 策略层：跟随 CPA 当前 Key，只编辑 RPM、模型白名单和额度窗口</p>
        </div>
      </div>
      <div class="toolbar">
        <span id="sync" class="chip stream info"><span class="dot"></span>准备同步</span>
        <button id="save" class="btn primary" type="button">保存策略</button>
        <button id="refresh" class="btn" type="button">刷新</button>
      </div>
    </header>

    <section class="metrics" id="metrics"></section>

    <section class="admin-board">
      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>Key 策略</h2>
            <p>Key 的新增、删除、复制和别名在 CPA/CPAMP 管理；这里仅维护 Plus 策略。</p>
          </div>
          <button id="reload-models" class="btn mini" type="button">重新获取模型</button>
        </div>
        <div class="table-wrap">
          <table class="data-table key-list-table">
            <thead>
              <tr>
                <th>Key</th>
                <th>启用</th>
                <th>配额</th>
                <th>模型</th>
              </tr>
            </thead>
            <tbody id="keys-body">
              <tr><td colspan="4" class="empty">加载中...</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <aside class="panel detail-panel" id="detail-panel">
        <div class="panel-head">
          <div>
            <h2>策略详情</h2>
            <p id="detail-subtitle">选择左侧 Key 后编辑。</p>
          </div>
        </div>
        <div id="detail-body" class="panel-body detail-body">
          <div class="empty">尚未选择 Key。</div>
        </div>
      </aside>
    </section>
  </div>

  <div id="editor-modal" class="modal-backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <div class="modal-head">
        <div>
          <h2 id="editor-title">编辑模型白名单</h2>
          <p class="subtitle">价格统一跟随 CPAMP 模型价格；这里仅选择当前 Key 允许使用的模型。</p>
        </div>
        <button class="btn mini" data-close="editor-modal" type="button">关闭</button>
      </div>
      <div class="modal-body">
        <div class="toolbar">
          <input id="edit-model-search" placeholder="搜索模型">
          <input id="edit-add-model" placeholder="手动添加模型名">
          <div class="modal-action-group">
            <button id="edit-add-model-btn" class="btn mini" type="button">添加</button>
            <button id="edit-select-visible" class="btn mini" type="button">全选当前结果</button>
            <button id="edit-use-discovered" class="btn mini" type="button">套用 CPA 发现模型</button>
            <button id="edit-clear-models" class="btn mini" type="button">清空选择</button>
          </div>
        </div>
        <div id="edit-selected" class="selected-chips"></div>
        <div id="unknown-notice" class="notice hidden"></div>
        <div id="price-warning" class="notice hidden"></div>
        <div class="selector-layout">
          <div class="model-list">
            <div class="model-list-head">
              <h3>模型列表</h3>
              <span id="model-source-hint" class="muted"></span>
            </div>
            <div id="edit-model-list" class="model-items"></div>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" data-close="editor-modal" type="button">取消</button>
        <button id="editor-apply" class="btn primary" type="button">应用到当前 Key</button>
      </div>
    </div>
  </div>

<script>
const API = String(window.CPA_KEY_POLICY_PLUS_API_BASE || "/key-policy-plus/api").replace(/\/$/, "");
const state = {
  keys: [],
  modelOptions: [],
  modelWarnings: [],
  pricing: null,
  selectedId: "",
  dirty: false,
  editor: null
};
const windows = [
  ["5h", "5H", "five_hour_usd"],
  ["24h", "24H", "daily_usd"],
  ["7d", "7D", "weekly_usd"],
  ["month", "月", "monthly_usd"]
];
const $ = id => document.getElementById(id);

function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(v){ const n = Number(v ?? 0); return Number.isFinite(n) ? n : 0; }
function money(v, digits=3){
  if (v === null || v === undefined || v === "") return "未设";
  const n = Number(v);
  return Number.isFinite(n) ? "$" + n.toFixed(digits) : "未设";
}
function inputMoney(v){
  if (v === null || v === undefined || v === "") return "";
  const n = Number(v);
  return Number.isFinite(n) && n > 0 ? n.toFixed(3) : "";
}
function pct(v){
  const n = Number(v);
  if (!Number.isFinite(n)) return "-";
  return Math.round(Math.max(0, Math.min(n, 9.99)) * 100) + "%";
}
function setSync(text, cls="info"){
  $("sync").className = "chip stream " + cls;
  $("sync").innerHTML = `<span class="dot"></span>${escapeHTML(text)}`;
}
function setButtonState(btn, stateText, cls){
  if (!btn) return () => {};
  const original = btn.dataset.originalText || btn.textContent;
  btn.dataset.originalText = original;
  btn.textContent = stateText || original;
  btn.classList.remove("is-busy", "is-done");
  if (cls) btn.classList.add(cls);
  if (cls === "is-busy") btn.disabled = true;
  return () => {
    btn.classList.remove("is-busy", "is-done");
    btn.disabled = false;
    btn.textContent = original;
  };
}
function flashButton(btn, text="已完成"){
  if (!btn) return;
  const restore = setButtonState(btn, text, "is-done");
  window.setTimeout(restore, 820);
}
async function withButtonFeedback(btn, busyText, doneText, fn){
  const restore = setButtonState(btn, busyText, "is-busy");
  try {
    const result = await fn();
    restore();
    flashButton(btn, doneText);
    return result;
  } catch (e) {
    restore();
    throw e;
  }
}
async function api(path, opts={}){
  const r = await fetch(API + path, {cache:"no-store", credentials:"same-origin", ...opts});
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (!r.ok || !d.ok) throw new Error(d.message || d.error || `HTTP ${r.status}`);
  return d;
}
function clone(value){ return JSON.parse(JSON.stringify(value || {})); }
function limitsOf(k){ return k.limits || {}; }
function usageOf(k){ return k.usage || {}; }
function selectedModels(k){ return Array.isArray(k.models) ? [...k.models] : []; }
function pricedModelSet(){
  return new Set(((state.pricing && state.pricing.models) || []).map(m => String(m || "").toLowerCase()));
}
function sourceLabel(source){
  source = String(source || "");
  if (source === "cpa_registry") return "CPA 发现";
  if (source === "host_auth") return "Auth 提示";
  if (source === "plus_configured") return "Plus 已配置";
  return source || "未知来源";
}
function optionMeta(o){
  const parts = [];
  if (o.provider) parts.push(o.provider);
  if (o.auth_name) parts.push(o.auth_name);
  parts.push(sourceLabel(o.source));
  return parts.filter(Boolean).join(" · ");
}
function hasGlobalModelPrice(model){ return pricedModelSet().has(String(model || "").toLowerCase()); }
function quotaOf(k, name){
  const q = (k.quota || {})[name] || {};
  const limits = limitsOf(k);
  const used = Number(q.used_usd ?? usageOf(k)[name] ?? 0);
  const limit = q.limit_usd ?? (
    name === "5h" ? limits.five_hour_usd :
    name === "24h" ? limits.daily_usd :
    name === "7d" ? limits.weekly_usd :
    limits.monthly_usd
  );
  let remaining = q.remaining_usd;
  let percent = q.percent;
  if (remaining == null && limit != null) remaining = Math.max(Number(limit) - used, 0);
  if (percent == null && limit != null && Number(limit) > 0) percent = used / Number(limit);
  return {used, limit, remaining, percent};
}
function hasAnyLimit(k){
  const limits = limitsOf(k);
  return ["five_hour_usd","daily_usd","weekly_usd","monthly_usd"].some(f => limits[f] !== null && limits[f] !== undefined && limits[f] !== "");
}
function policyWarnings(k){
  const warnings = [];
  if (Number(k.rpm || 0) <= 0) warnings.push("未配置 RPM");
  if (!hasAnyLimit(k)) warnings.push("未配置费用限额");
  return warnings;
}
function limitHint(k){
  const warnings = policyWarnings(k);
  return warnings.length ? warnings.join(" · ") : "限额已配置";
}
function configuredQuotaCount(k){
  const limits = limitsOf(k);
  return ["five_hour_usd","daily_usd","weekly_usd","monthly_usd"].filter(f => limits[f] !== null && limits[f] !== undefined && limits[f] !== "").length;
}
function quotaStateText(k){
  const count = configuredQuotaCount(k);
  return count ? `${count}/4 额度` : "未配置配额";
}
function rpmStateText(k){
  const rpm = Number(k.rpm || 0);
  return rpm > 0 ? `RPM ${rpm}` : "RPM 未配置";
}
function missingPriceModels(k){
  const models = selectedModels(k);
  return models.filter(m => !hasGlobalModelPrice(m));
}
function modelCountText(k){
  const models = selectedModels(k);
  return models.length ? `${models.length} 个模型` : "允许全部模型";
}
function modelPreview(k){
  const models = selectedModels(k);
  if (!models.length) return "空列表：允许全部模型";
  const shown = models.slice(0, 3).join(", ");
  return models.length > 3 ? `${shown} +${models.length - 3}` : shown;
}
function displayPreview(v){ return String(v || "").replace(/\.\.\./g, "…"); }
function visibleKeys(){
  return state.keys.filter(k => !k.hidden && k.source_present !== false);
}
function findKey(id){ return state.keys.find(k => k.id === id); }
function ensureSelection(){
  const list = visibleKeys();
  if (state.selectedId && list.some(k => k.id === state.selectedId)) return;
  state.selectedId = list[0]?.id || "";
}
function markDirty(){
  state.dirty = true;
  setSync("有未保存策略", "warn");
}
function limitValue(k, field){ return limitsOf(k)[field]; }
function setLimitValue(k, field, value){
  k.limits = k.limits || {};
  k.limits[field] = nullableNumber(value);
}
function nullableNumber(raw){
  raw = String(raw ?? "").trim();
  if (raw === "") return null;
  const n = Number(raw);
  if (!Number.isFinite(n) || n < 0) throw new Error("数字字段不能为负或非法");
  return n;
}
function cleanStrings(items){
  const seen = new Set();
  const out = [];
  for (const item of items || []) {
    const text = String(item || "").trim();
    const key = text.toLowerCase();
    if (!text || seen.has(key)) continue;
    seen.add(key);
    out.push(text);
  }
  return out;
}
function keyPayload(k){
  const limits = limitsOf(k);
  return {
    id: k.id,
    enabled: !!k.enabled,
    rpm: nullableNumber(k.rpm) || 0,
    concurrency: 0,
    max_active_sessions: 0,
    models: cleanStrings(k.models || []),
    five_hour_usd: nullableNumber(limits.five_hour_usd),
    daily_usd: nullableNumber(limits.daily_usd),
    weekly_usd: nullableNumber(limits.weekly_usd),
    monthly_usd: nullableNumber(limits.monthly_usd)
  };
}

function renderMetrics(){
  const total = state.keys.length;
  const enabled = state.keys.filter(k => k.enabled && k.source_present !== false).length;
  const unlimited = state.keys.filter(k => policyWarnings(k).length).length;
  const cost = state.keys.reduce((s,k) => s + Number(usageOf(k)["24h"] || 0), 0);
  const priceSource = state.pricing && state.pricing.source === "cpamp_cached_price_book" ? "CPAMP 缓存价格" : state.pricing && state.pricing.source === "cpamp_price_book" ? "CPAMP 当前价格" : "价格源待同步";
  $("metrics").innerHTML = `
    <article class="metric"><div class="label">当前 Key</div><div class="value">${total}</div><div class="hint">跟随 CPA/CPAMP 当前配置</div></article>
    <article class="metric"><div class="label">启用</div><div class="value">${enabled}</div><div class="hint">可通过右侧切换</div></article>
    <article class="metric"><div class="label">24H 费用</div><div class="value">$${cost.toFixed(3)}</div><div class="hint">${escapeHTML(priceSource)}</div></article>
    <article class="metric"><div class="label">需补策略</div><div class="value">${unlimited}</div><div class="hint">${unlimited ? "请补 RPM 或费用窗口" : "全部已配置"}</div></article>`;
}
function renderKeyList(){
  const body = $("keys-body");
  const list = visibleKeys();
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="4" class="empty">暂无可显示策略。请先在 CPA/CPAMP 添加 Key，然后刷新同步。</td></tr>`;
    return;
  }
  body.innerHTML = list.map(k => `
    <tr class="key-row ${k.id === state.selectedId ? "selected" : ""}" data-select="${escapeHTML(k.id)}">
      <td><div class="key-title"><strong>${escapeHTML(k.name || k.alias || "-")}</strong><small class="mono">${escapeHTML(displayPreview(k.preview || k.id || ""))}</small></div></td>
      <td><span class="tag ${k.enabled ? "ok" : "bad"}">${k.enabled ? "启用" : "停用"}</span></td>
      <td><div class="status-summary"><div class="tag-row"><span class="tag ${hasAnyLimit(k) ? "ok" : "warn"}">${escapeHTML(quotaStateText(k))}</span><span class="tag ${Number(k.rpm || 0) > 0 ? "soft" : "warn"}">${escapeHTML(rpmStateText(k))}</span></div><small>${escapeHTML(limitHint(k))}</small></div></td>
      <td><div class="stack"><span class="tag ${selectedModels(k).length ? "soft" : "warn"}">${escapeHTML(modelCountText(k))}</span><small>${escapeHTML(modelPreview(k))}</small></div></td>
    </tr>`).join("");
  body.querySelectorAll("[data-select]").forEach(row => row.onclick = () => {
    state.selectedId = row.getAttribute("data-select");
    render();
  });
}
function renderQuotaCard(key, name, label, field, disabled){
  const q = quotaOf(key, name);
  const percent = Number(q.percent || 0);
  const barClass = percent >= 1 ? "bad" : percent >= .8 ? "warn" : "";
  return `<div class="quota-card">
    <div class="quota-card-head"><strong>${escapeHTML(label)}</strong><span class="tag ${barClass ? barClass : "soft"}">${pct(q.percent)}</span></div>
    <dl class="quota-values">
      <div><dt>已用</dt><dd>${money(q.used)}</dd></div>
      <div><dt>限额</dt><dd>${money(q.limit)}</dd></div>
      <div><dt>剩余</dt><dd>${money(q.remaining)}</dd></div>
    </dl>
    <div class="bar ${barClass}"><span style="width:${Math.min(percent * 100, 100)}%"></span></div>
    <label class="quota-limit-field">编辑限额<input data-limit="${field}" type="number" min="0" step="0.001" value="${inputMoney(limitValue(key, field))}" placeholder="不限" ${disabled}></label>
  </div>`;
}
function renderDetail(){
  const key = findKey(state.selectedId);
  const body = $("detail-body");
  if (!key) {
    $("detail-subtitle").textContent = "选择左侧 Key 后编辑。";
    body.innerHTML = `<div class="empty">尚未选择 Key。</div>`;
    return;
  }
  $("detail-subtitle").textContent = `${key.name || key.alias || "-"} · ${displayPreview(key.preview || key.id)}`;
  const disabled = key.source_present === false ? "disabled" : "";
  const warnings = policyWarnings(key);
  const missingPrices = missingPriceModels(key);
  const alertParts = [];
  if (key.source_present === false) alertParts.push("这个 Key 已不在 CPA 当前配置中，策略只读。");
  if (key.inherit_conflict) alertParts.push("同名历史策略存在多条候选，请人工确认模板。");
  if (warnings.length) alertParts.push(`当前缺少：${warnings.join("、")}。`);
  if (missingPrices.length) alertParts.push(`${missingPrices.length} 个模型在 CPAMP 中未配置价格，费用额度统计可能不完整。`);
  body.innerHTML = `
    <div class="detail-summary">
      <div class="summary-card"><small>启用状态</small><strong class="${key.enabled ? "success" : "bad-text"}">${key.enabled ? "启用" : "停用"}</strong></div>
      <div class="summary-card"><small>配额</small><strong>${escapeHTML(quotaStateText(key))}</strong><div class="detail-note">${escapeHTML(rpmStateText(key))}</div></div>
      <div class="summary-card"><small>模型</small><strong>${escapeHTML(modelCountText(key))}</strong><div class="detail-note">${escapeHTML(modelPreview(key))}</div></div>
    </div>
    ${alertParts.length ? `<div class="notice">${escapeHTML(alertParts.join(" "))}</div>` : ""}
    <div class="section-title"><h3>基础策略</h3></div>
    <div class="field-grid">
      <label class="span-2">Key 别名<input value="${escapeHTML(key.name || key.alias || "")}" disabled></label>
      <label>启用状态<select data-detail="enabled" ${disabled}><option value="true" ${key.enabled ? "selected" : ""}>启用</option><option value="false" ${!key.enabled ? "selected" : ""}>禁用</option></select></label>
      <label>RPM<input data-detail="rpm" type="number" min="0" value="${Number(key.rpm || 0)}" ${disabled}></label>
    </div>
    <div class="section-title"><h3>额度窗口</h3><small>已用 / 限额 / 剩余</small></div>
    <div class="quota-editor">${windows.map(([name,label,field]) => renderQuotaCard(key, name, label, field, disabled)).join("")}</div>
    <div class="section-title"><h3>模型白名单</h3><button class="btn mini" id="edit-models" type="button" ${disabled}>编辑模型白名单</button></div>
    <div class="model-summary">
      <div><strong>${escapeHTML(modelCountText(key))}</strong><div class="detail-note">${escapeHTML(modelPreview(key))}</div></div>
      <small>${missingPrices.length ? `${missingPrices.length} 个模型未在 CPAMP 定价` : "费用按 CPAMP 模型价格统计。"}</small>
    </div>
    <div class="section-title"><h3>Soft Reset</h3></div>
    <div class="actions">
      <button class="btn mini" data-reset="5h" type="button">清5H</button>
      <button class="btn mini" data-reset="24h" type="button">清24H</button>
      <button class="btn mini" data-reset="7d" type="button">清7D</button>
      <button class="btn mini" data-reset="month" type="button">清月</button>
      <button class="btn mini" data-reset="all" type="button">清全部</button>
    </div>`;
  body.querySelectorAll("[data-detail]").forEach(input => input.oninput = () => updateDetail(input));
  body.querySelectorAll("[data-detail]").forEach(input => input.onchange = () => updateDetail(input));
  body.querySelectorAll("[data-limit]").forEach(input => input.oninput = () => {
    setLimitValue(key, input.dataset.limit, input.value);
    markDirty();
    renderKeyList();
  });
  body.querySelectorAll("[data-reset]").forEach(btn => btn.onclick = () => resetSelected(btn.dataset.reset, btn));
  const edit = $("edit-models");
  if (edit) edit.onclick = () => openEditor(key.id);
}
function updateDetail(input){
  const key = findKey(state.selectedId);
  if (!key || key.source_present === false) return;
  const field = input.dataset.detail;
  if (field === "enabled") key.enabled = input.value === "true";
  else if (field === "rpm") key[field] = Number(input.value || 0);
  markDirty();
  renderKeyList();
}
function render(){
  ensureSelection();
  renderMetrics();
  renderKeyList();
  renderDetail();
}

async function load(opts={}){
  const run = async () => {
    setSync(opts.syncText || "同步中", "info");
    const [keys, models] = await Promise.all([api("/keys"), api("/models").catch(e => ({ok:false, models:[], warnings:[e.message]}))]);
    state.keys = keys.keys || [];
    state.modelOptions = models.models || [];
    state.pricing = keys.pricing || models.pricing || null;
    state.modelWarnings = [...(models.warnings || []), ...((state.pricing && state.pricing.warnings) || [])];
    state.dirty = false;
    setSync(opts.doneSyncText || "已同步", "ok");
    render();
  };
  try {
    if (opts.button) await withButtonFeedback(opts.button, opts.busyText || "同步中", opts.doneText || "已更新", run);
    else await run();
  } catch(e) {
    setSync("同步失败：" + e.message, "bad");
  }
}
async function saveAll(){
  const run = async () => {
    setSync("保存中", "info");
    const editable = state.keys.filter(k => k.source_present !== false);
    const resp = await api("/keys/save", {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({keys: editable.map(keyPayload)})
    });
    state.keys = resp.keys || state.keys;
    state.dirty = false;
    setSync("已保存", "ok");
    render();
  };
  try {
    await withButtonFeedback($("save"), "保存中", "已保存", run);
  } catch(e) {
    setSync("保存失败：" + e.message, "bad");
  }
}
async function resetSelected(windowName, btn){
  const key = findKey(state.selectedId);
  if (!key) return;
  if (!confirm(`确认清零 ${key.name || key.id} 的 ${windowName} 用量统计？这只写入 soft reset，不删除历史明细。`)) return;
  try {
    await withButtonFeedback(btn, "清零中", "已清零", () => api("/keys/reset", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id:key.id, window:windowName})
    }));
    setSync("已清零", "ok");
    await load();
  } catch(e) {
    setSync("清零失败：" + e.message, "bad");
  }
}

function allModelOptions(extra=[]){
  const byID = new Map();
  for (const opt of state.modelOptions || []) {
    if (!opt || !opt.id) continue;
    byID.set(String(opt.id).toLowerCase(), opt);
  }
  for (const id of extra || []) {
    const key = String(id).toLowerCase();
    if (!byID.has(key)) byID.set(key, {id, display_name:id, source:"plus_configured", known:false});
  }
  return [...byID.values()].sort((a,b) => String(a.id).localeCompare(String(b.id)));
}
function optionMatches(opt, search){
  search = String(search || "").trim().toLowerCase();
  if (!search) return true;
  return String(opt.id || "").toLowerCase().includes(search) || String(opt.display_name || "").toLowerCase().includes(search);
}
function selectedChips(set){
  const items = [...set].sort();
  if (!items.length) return `<span class="muted">未选择模型：允许全部模型</span>`;
  return items.map(m => `<span class="tag">${escapeHTML(m)} <button class="chip-button" data-remove-model="${escapeHTML(m)}" type="button">×</button></span>`).join("");
}
function renderModelOptions(container, selectedSet, search, options){
  const filtered = options.filter(o => optionMatches(o, search));
  if (!filtered.length) {
    container.innerHTML = `<div class="empty">没有匹配模型。</div>`;
    return;
  }
  container.innerHTML = filtered.map(o => {
    const selected = selectedSet.has(o.id);
    const missingPrice = selected && !hasGlobalModelPrice(o.id);
    return `<label class="model-option">
      <input type="checkbox" data-model-option="${escapeHTML(o.id)}" ${selected ? "checked" : ""}>
      <span>
        <strong>${escapeHTML(o.display_name || o.id)}</strong>
        <small>${escapeHTML(o.id)}</small>
        <span class="model-meta"><span class="tag">${escapeHTML(optionMeta(o))}</span>${missingPrice ? `<span class="tag warn">未配置价格</span>` : ""}</span>
      </span>
    </label>`;
  }).join("");
  container.querySelectorAll("[data-model-option]").forEach(input => input.onchange = () => {
    if (input.checked) selectedSet.add(input.dataset.modelOption);
    else selectedSet.delete(input.dataset.modelOption);
    renderEditor();
  });
}
function openEditor(id){
  const key = findKey(id);
  if (!key || key.source_present === false) return;
  state.editor = {
    keyId: id,
    models: new Set(selectedModels(key)),
    search: ""
  };
  $("edit-model-search").value = "";
  $("edit-add-model").value = "";
  renderEditor();
  openModal("editor-modal");
}
function renderEditor(){
  const editor = state.editor;
  if (!editor) return;
  const options = allModelOptions([...editor.models]);
  $("model-source-hint").textContent = state.modelWarnings.join(" ");
  $("edit-selected").innerHTML = selectedChips(editor.models);
  $("edit-selected").querySelectorAll("[data-remove-model]").forEach(btn => btn.onclick = () => {
    editor.models.delete(btn.dataset.removeModel);
    renderEditor();
  });
  renderModelOptions($("edit-model-list"), editor.models, $("edit-model-search").value || "", options);
  const unknown = [...editor.models].filter(m => !options.some(o => o.id === m && o.known));
  $("unknown-notice").classList.toggle("hidden", unknown.length === 0);
  $("unknown-notice").textContent = unknown.length ? `以下模型来自现有策略或手动输入：${unknown.join(", ")}` : "";
  const missingPrices = [...editor.models].filter(m => !hasGlobalModelPrice(m));
  $("price-warning").classList.toggle("hidden", missingPrices.length === 0);
  $("price-warning").textContent = missingPrices.length ? `以下模型未在 CPAMP 配置价格，费用额度统计可能不完整：${missingPrices.join(", ")}` : "";
}
function addEditorModel(btn){
  const id = $("edit-add-model").value.trim();
  if (!id || !state.editor) return;
  state.editor.models.add(id);
  $("edit-add-model").value = "";
  renderEditor();
  flashButton(btn, "已添加");
}
function applyEditor(btn){
  const editor = state.editor;
  if (!editor) return;
  const key = findKey(editor.keyId);
  if (!key) return;
  key.models = cleanStrings([...editor.models]);
  markDirty();
  if (btn) {
    const restore = setButtonState(btn, "已应用", "is-done");
    window.setTimeout(() => {
      restore();
      closeModal("editor-modal");
      render();
    }, 180);
  } else {
    closeModal("editor-modal");
    render();
  }
}
function openModal(id){
  const el = $(id);
  if (!el) return;
  el.classList.add("open");
  el.setAttribute("aria-hidden", "false");
}
function closeModal(id){
  const el = $(id);
  if (!el) return;
  el.classList.remove("open");
  el.setAttribute("aria-hidden", "true");
}

$("save").onclick = saveAll;
$("refresh").onclick = () => load({button:$("refresh"), busyText:"刷新中", doneText:"已刷新"});
$("reload-models").onclick = () => load({button:$("reload-models"), busyText:"获取中", doneText:"已更新", syncText:"获取模型中", doneSyncText:"模型已更新"});
$("edit-model-search").oninput = renderEditor;
$("edit-add-model-btn").onclick = () => addEditorModel($("edit-add-model-btn"));
$("edit-select-visible").onclick = () => {
  if (!state.editor) return;
  const search = $("edit-model-search").value || "";
  allModelOptions([...state.editor.models]).filter(o => optionMatches(o, search)).forEach(o => state.editor.models.add(o.id));
  renderEditor();
  flashButton($("edit-select-visible"), "已选择");
};
$("edit-use-discovered").onclick = () => {
  if (!state.editor) return;
  const discovered = allModelOptions([...state.editor.models]).filter(o => o.source === "cpa_registry" && o.known);
  if (!discovered.length) {
    flashButton($("edit-use-discovered"), "暂无发现");
    return;
  }
  state.editor.models = new Set(discovered.map(o => o.id));
  renderEditor();
  flashButton($("edit-use-discovered"), "已套用");
};
$("edit-clear-models").onclick = () => { if (state.editor) { state.editor.models.clear(); renderEditor(); flashButton($("edit-clear-models"), "已清空"); } };
$("editor-apply").onclick = () => applyEditor($("editor-apply"));
document.querySelectorAll("[data-close]").forEach(btn => btn.onclick = () => closeModal(btn.dataset.close));
window.addEventListener("beforeunload", e => {
  if (!state.dirty) return;
  e.preventDefault();
  e.returnValue = "";
});
load();
</script>
</body>
</html>
