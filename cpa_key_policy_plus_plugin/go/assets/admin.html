<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CPA Key Policy+</title>
  <script>
    // CPAMP paints its theme into this iframe only after load; read it from the
    // parent first so the page does not flash the wrong theme.
    (function () {
      try {
        if (window.parent && window.parent !== window) {
          var theme = window.parent.document.documentElement.getAttribute("data-theme");
          if (theme) document.documentElement.setAttribute("data-theme", theme === "dark" ? "dark" : "white");
        }
      } catch (_) {}
    })();
  </script>
  <style>{{CSS}}</style>
  <style>
    /* Fallbacks carry CPAMP's own token values for when the page is opened
       outside CPAMP; inside CPAMP the injected variables win. */
    :root {
      --kpf-bg: #ffffff;
      --kpf-sunken: #f6faff;
      --kpf-hover: #f1f7fe;
      --kpf-text: #2c3e50;
      --kpf-text-2: #5f6c7b;
      --kpf-line: rgba(15, 23, 42, .08);
      --kpf-line-strong: rgba(15, 23, 42, .12);
      --kpf-primary: #409eff;
      --kpf-success: #67c23a;
      --kpf-warning: #e6a23c;
      --kpf-danger: #f56c6c;
    }
    :root[data-theme="dark"] {
      --kpf-bg: #181c28;
      --kpf-sunken: rgba(255, 255, 255, .06);
      --kpf-hover: rgba(64, 158, 255, .12);
      --kpf-text: #e5e5e5;
      --kpf-text-2: #a3a3a3;
      --kpf-line: rgba(255, 255, 255, .08);
      --kpf-line-strong: rgba(255, 255, 255, .12);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --kpf-bg: #181c28;
        --kpf-sunken: rgba(255, 255, 255, .06);
        --kpf-hover: rgba(64, 158, 255, .12);
        --kpf-text: #e5e5e5;
        --kpf-text-2: #a3a3a3;
        --kpf-line: rgba(255, 255, 255, .08);
        --kpf-line-strong: rgba(255, 255, 255, .12);
      }
    }
    body.kp-admin {
      --kp-figures: var(--kp-font);
      --kp-bg: var(--bg-primary, var(--kpf-bg));
      --kp-surface: var(--bg-primary, var(--kpf-bg));
      --kp-sunken: var(--surface-subtle, var(--kpf-sunken));
      --kp-hover: var(--surface-subtle-hover, var(--kpf-hover));
      --kp-text: var(--text-primary, var(--kpf-text));
      --kp-text-2: var(--text-secondary, var(--kpf-text-2));
      --kp-text-3: var(--text-secondary, var(--kpf-text-2));
      --kp-line: var(--border-color, var(--kpf-line));
      --kp-line-strong: var(--border-primary, var(--kpf-line-strong));
      --kp-accent: var(--primary-color, var(--kpf-primary));
      --kp-accent-ink: var(--primary-contrast, #ffffff);
      --kp-ok: var(--success-color, var(--kpf-success));
      --kp-warn: var(--warning-color, var(--kpf-warning));
      --kp-over: var(--danger-color, var(--kpf-danger));
      --kp-pending: var(--primary-color, var(--kpf-primary));
      --kp-ok-ink: color-mix(in srgb, var(--kp-ok) 45%, var(--kp-text));
      --kp-warn-ink: color-mix(in srgb, var(--kp-warn) 45%, var(--kp-text));
      --kp-over-ink: color-mix(in srgb, var(--kp-over) 55%, var(--kp-text));
      --kp-pending-ink: color-mix(in srgb, var(--kp-pending) 55%, var(--kp-text));
      --kp-radius: var(--app-radius-md, 12px);
      --kp-radius-sm: var(--app-radius-sm, 8px);
      --kp-focus: var(--kp-accent);
      --kp-meter-fill: var(--kp-accent);
      padding: 20px 24px 0;
    }

    .admin { max-width: 1480px; margin: 0 auto; }
    .admin-head { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 12px 24px; }
    .admin-head h1 { font-size: 1.5rem; font-weight: 700; line-height: 1.3; }
    .admin-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .sync { display: flex; align-items: center; gap: 7px; margin-right: 4px; font-size: var(--kp-fs-sm); color: var(--kp-text-2); }
    .sync b { font-weight: 600; color: var(--kp-text-2); }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kp-text-2); }
    .sync[data-state="ok"] .sync-dot { background: var(--kp-ok); }
    .sync[data-state="warn"] .sync-dot { background: var(--kp-warn); }
    .sync[data-state="bad"] .sync-dot { background: var(--kp-over); }
    .sync[data-state="warn"] b { color: var(--kp-warn-ink); }
    .sync[data-state="bad"] b { color: var(--kp-over-ink); }
    .sync[data-state="info"] .sync-dot { background: transparent; border: 2px solid var(--kp-accent); border-right-color: transparent; animation: kp-spin .8s linear infinite; }

    .facts-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; margin-top: 16px; padding: 10px 14px; border-radius: var(--kp-radius-sm); background: var(--kp-sunken); font-size: var(--kp-fs-sm); color: var(--kp-text-2); }
    .fact b { margin-right: 6px; font-size: var(--kp-fs-md); font-weight: 700; color: var(--kp-text); font-variant-numeric: tabular-nums; }
    .fact.is-warn b { color: var(--kp-warn-ink); }
    .fact-price { margin-left: auto; }
    .fact-price b { margin-right: 0; font-size: var(--kp-fs-sm); font-weight: 600; color: var(--kp-text-2); }
    .fact-price + .fact-price { margin-left: 0; }

    .section-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
    .section-head h2 { font-size: var(--kp-fs-lg); font-weight: 700; }
    .count { min-width: 22px; padding: 0 7px; border-radius: 999px; background: var(--kp-sunken); font-size: var(--kp-fs-xs); font-weight: 700; line-height: 20px; text-align: center; color: var(--kp-text-2); }
    .count:empty { display: none; }

    .inbox { margin-top: 22px; }
    .todo-list { display: grid; }
    .todo { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 10px 2px; border-bottom: 1px solid var(--kp-line); }
    .todo:first-child { border-top: 1px solid var(--kp-line); }
    .todo-mark { width: 8px; height: 8px; border-radius: 2px; background: var(--kp-text-2); }
    .sev-over .todo-mark { background: var(--kp-over); }
    .sev-warn .todo-mark { background: var(--kp-warn); }
    .sev-pending .todo-mark { background: var(--kp-pending); }
    .todo-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; min-width: 0; }
    .todo-name { font-weight: 700; overflow-wrap: anywhere; }
    .todo-text { color: var(--kp-text-2); overflow-wrap: anywhere; }
    .sev-over .todo-text { color: var(--kp-over-ink); }
    .sev-pending .todo-text { color: var(--kp-pending-ink); }
    .todo-clear { grid-template-columns: minmax(0, 1fr); color: var(--kp-text-2); }
    .todo-clear .todo-main { color: var(--kp-text-2); }

    .keys { margin-top: 26px; }
    .keys-search { width: min(280px, 100%); margin-left: auto; }
    .table-scroll { overflow-x: auto; }
    .key-table { width: 100%; min-width: 900px; border-collapse: collapse; }
    .key-table th { padding: 9px 10px; border-bottom: 1px solid var(--kp-line); font-size: var(--kp-fs-xs); font-weight: 600; text-align: left; white-space: nowrap; color: var(--kp-text-2); }
    .key-table td { padding: 10px; border-bottom: 1px solid var(--kp-line); vertical-align: middle; }
    .key-table .r { text-align: right; }
    .key-row { cursor: pointer; transition: background-color .15s ease; }
    .key-row:hover, .key-row.is-open { background: var(--kp-hover); }
    .c-key { min-width: 220px; }
    .key-toggle { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; cursor: pointer; }
    .key-chev { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--kp-ease); }
    .is-open .key-chev { transform: rotate(90deg); }
    .key-id { display: grid; min-width: 0; }
    .key-name { font-weight: 700; overflow-wrap: anywhere; }
    .key-prev { font-size: var(--kp-fs-xs); }
    .key-badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 0 22px; }
    .key-badges:empty { display: none; }
    .badge { padding: 0 6px; border: 1px solid var(--kp-line-strong); border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 18px; color: var(--kp-text-2); }
    .badge-dirty { border-color: var(--kp-warn); color: var(--kp-warn-ink); }
    .badge-hold { border-color: var(--kp-pending); color: var(--kp-pending-ink); }
    .c-num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .c-q { width: 12%; min-width: 118px; }
    .q-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .q-pct { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .q-note { margin-top: 3px; font-size: var(--kp-fs-xs); color: var(--kp-text-3); white-space: nowrap; }
    .q-note.st-warn { color: var(--kp-warn-ink); }
    .q-amt { font-size: var(--kp-fs-xs); color: var(--kp-text-2); white-space: nowrap; }
    .c-q .meter { height: 4px; margin-top: 5px; }
    .empty { padding: 28px 12px; text-align: center; color: var(--kp-text-2); }

    .ed-row > td { padding: 0 0 4px; background: var(--kp-hover); }
    .editor { display: grid; gap: 14px; margin: 0 10px 10px; padding: 16px; border: 1px solid var(--kp-line); border-radius: var(--kp-radius-sm); background: var(--kp-surface); }
    .ed-grid { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 14px 28px; }
    .ed-block h3 { margin-bottom: 10px; font-size: var(--kp-fs-sm); font-weight: 700; }
    .ed-block + .ed-block { padding-top: 14px; border-top: 1px solid var(--kp-line); }
    .ed-grid .ed-block + .ed-block { padding-top: 0; border-top: 0; }
    .ed-check { display: flex; align-items: center; gap: 8px; min-height: 34px; cursor: pointer; }
    .ed-check input { width: 16px; height: 16px; margin: 0; accent-color: var(--kp-accent); }
    .ed-field, .ed-win { display: grid; gap: 5px; margin-top: 8px; }
    .ed-label { font-size: var(--kp-fs-xs); font-weight: 600; color: var(--kp-text-2); }
    .ed-hint { margin-top: 8px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .ed-windows { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .ed-windows .ed-win { margin-top: 0; }
    .ed-proj { font-size: var(--kp-fs-xs); color: var(--kp-text-2); font-variant-numeric: tabular-nums; }
    .ed-proj.st-warn { color: var(--kp-warn-ink); font-weight: 600; }
    .ed-proj.st-over { color: var(--kp-over-ink); font-weight: 600; }
    .ed-alert { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 10px 12px; border: 1px solid var(--kp-line-strong); border-radius: var(--kp-radius-sm); background: var(--kp-sunken); color: var(--kp-text); }
    .ed-alert.sev-pending { border-color: color-mix(in srgb, var(--kp-pending) 45%, transparent); }
    .ed-alert.sev-over { border-color: color-mix(in srgb, var(--kp-over) 45%, transparent); color: var(--kp-over-ink); }
    .ed-alert.sev-ok { border-color: color-mix(in srgb, var(--kp-ok) 45%, transparent); color: var(--kp-ok-ink); }
    .ed-models-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
    .ed-models-head h3 { margin: 0; }
    .ed-models-head b { font-weight: 600; color: var(--kp-text-2); }
    .ed-models-head .btn { margin-left: auto; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .chip { display: inline-flex; align-items: center; gap: 4px; min-height: 24px; padding: 0 8px; border: 1px solid var(--kp-line-strong); border-radius: 6px; background: var(--kp-sunken); font-size: var(--kp-fs-xs); font-weight: 600; }
    .chip.is-unpriced { border-color: var(--kp-warn); }
    .chip-x { width: 18px; height: 18px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: inherit; line-height: 1; cursor: pointer; }
    .chip-x svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
    .chips-empty { font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .picker { display: grid; gap: 10px; margin-top: 12px; padding: 12px; border: 1px solid var(--kp-line); border-radius: var(--kp-radius-sm); background: var(--kp-sunken); }
    .picker-tools { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
    .picker-add { display: flex; gap: 8px; }
    .picker-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .picker-source { flex: 1 1 200px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .picker-warn { display: grid; gap: 4px; font-size: var(--kp-fs-xs); }
    .picker-warn:empty { display: none; }
    .picker-warn .st-warn { font-weight: 600; }
    .picker-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px 12px; max-height: 320px; overflow: auto; padding: 4px; border-radius: 6px; background: var(--kp-surface); }
    .opt { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; align-items: start; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
    .opt:hover { background: var(--kp-hover); }
    .opt input { width: 15px; height: 15px; margin: 2px 0 0; accent-color: var(--kp-accent); }
    .opt-name { display: block; font-weight: 600; overflow-wrap: anywhere; }
    .opt-meta { display: block; font-size: 11px; color: var(--kp-text-2); overflow-wrap: anywhere; }
    .opt-warn { display: block; font-size: 11px; font-weight: 600; color: var(--kp-warn-ink); }
    .ed-resets { display: flex; flex-wrap: wrap; gap: 8px; }

    .savebar { position: sticky; bottom: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 18px -24px 0; padding: 12px 24px; border-top: 1px solid var(--kp-line-strong); background: var(--kp-bg); box-shadow: 0 -8px 20px -16px rgba(15, 23, 42, .5); }
    .savebar[hidden] { display: none; }
    .savebar-text { flex: 1 1 260px; min-width: 0; font-size: var(--kp-fs-sm); color: var(--kp-warn-ink); font-weight: 600; overflow-wrap: anywhere; }
    .page-end { height: 24px; }


    /* Carpool pools: one block per upstream account */
    .pools { margin-top: 26px; }
    .pools-new { margin-left: auto; }
    .pool-list { display: grid; gap: 16px; }
    .pool { border: 1px solid var(--kp-line-strong); border-radius: var(--kp-radius); background: var(--kp-surface); }
    .pool-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 14px 16px 12px; border-bottom: 1px solid var(--kp-line); }
    .pool-name { min-width: 0; margin-right: auto; }
    .pool-name h3 { font-size: var(--kp-fs-md); font-weight: 700; line-height: 1.35; }
    .pool-acct { margin-top: 2px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); overflow-wrap: anywhere; }
    .pool-live { display: flex; align-items: center; gap: 7px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .pool-live b { font-weight: 600; }
    .pool-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--kp-text-2); }
    .pool-live[data-state="live"] .pool-dot { background: var(--kp-ok); }
    .pool-live[data-state="stale"] .pool-dot,
    .pool-live[data-state="reset_pending"] .pool-dot { background: transparent; border: 1.5px solid var(--kp-text-2); }
    .pool-body { display: grid; gap: 14px; padding: 14px 16px 16px; }

    .pool-figs { display: grid; grid-template-columns: minmax(150px, 1.3fr) repeat(4, minmax(110px, 1fr)); gap: 12px 20px; margin: 0; }
    .pool-figs.has-short { grid-template-columns: minmax(150px, 1.3fr) repeat(5, minmax(104px, 1fr)); }
    .pf { min-width: 0; color: var(--kp-text-2); }
    .pf dt { font-size: var(--kp-fs-xs); font-weight: 600; }
    .pf dd { margin: 3px 0 0; }
    .pf b { display: block; color: var(--kp-text); font-size: var(--kp-fs-lg); font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.3; white-space: nowrap; }
    .pf .pf-big { font-size: var(--kp-fs-xl); }
    .pf-sub { margin-top: 2px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .pf .meter { height: 5px; margin-top: 6px; }
    .pf.is-over b { color: var(--kp-over-ink); }
    .pf.is-warn b { color: var(--kp-warn-ink); }

    .pool-chart { display: grid; gap: 6px; }
    .chart-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
    .chart-title { font-size: var(--kp-fs-sm); font-weight: 700; }
    .chart-note { font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .pool-seg { display: inline-flex; overflow: hidden; border: 1px solid var(--kp-line-strong); border-radius: var(--kp-radius-sm); }
    .pool-seg button { min-height: 28px; padding: 0 12px; border: 0; background: transparent; color: var(--kp-text-2); font-size: var(--kp-fs-xs); font-weight: 600; cursor: pointer; }
    .pool-seg button + button { border-left: 1px solid var(--kp-line-strong); }
    .pool-seg button[aria-pressed="true"] { background: var(--kp-sunken); color: var(--kp-text); }
    .chart-plot { position: relative; height: 150px; cursor: crosshair; touch-action: pan-y; }
    .chart-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .chart-plot:focus-visible { outline-offset: 3px; border-radius: 4px; }
    .ch-grid { stroke: var(--kp-line); stroke-width: 1; }
    .ch-axis { fill: var(--kp-text-2); font-size: 11px; font-variant-numeric: tabular-nums; }
    .ch-band { fill: color-mix(in srgb, var(--kp-accent) 14%, transparent); }
    .ch-line { fill: none; stroke: var(--kp-accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .ch-dot { fill: var(--kp-accent); }
    .ch-day { fill: var(--kp-surface); stroke: var(--kp-text-2); stroke-width: 1.2; }
    .ch-now { stroke: var(--kp-text-2); stroke-width: 1; stroke-dasharray: 3 3; }
    .ch-guide { stroke: var(--kp-text); stroke-width: 1; opacity: .35; }
    .ch-focus { fill: var(--kp-surface); stroke: var(--kp-accent); stroke-width: 2; }
    .chart-empty { display: grid; place-items: center; min-height: 96px; padding: 12px 16px; border-radius: var(--kp-radius-sm); background: var(--kp-sunken); font-size: var(--kp-fs-sm); color: var(--kp-text-2); text-align: center; text-wrap: pretty; }
    .pool-list > .chart-empty { min-height: 0; padding: 16px; }
    .chart-tip { display: block; min-height: 1.5em; font-size: var(--kp-fs-xs); color: var(--kp-text-2); font-variant-numeric: tabular-nums; }

    .pool-table { width: 100%; border-collapse: collapse; }
    .pool-table th { padding: 8px 10px; border-bottom: 1px solid var(--kp-line); font-size: var(--kp-fs-xs); font-weight: 600; text-align: left; white-space: nowrap; color: var(--kp-text-2); }
    .pool-table td { padding: 9px 10px; border-bottom: 1px solid var(--kp-line); vertical-align: middle; }
    .pool-table .r { text-align: right; }
    .pm-row { cursor: pointer; transition: background-color .15s ease; }
    .pm-row:hover, .pm-row.is-open { background: var(--kp-hover); }
    .pm-who { display: grid; min-width: 0; }
    .pm-name { font-weight: 700; overflow-wrap: anywhere; }
    .pm-sub { font-size: var(--kp-fs-xs); color: var(--kp-text-2); font-variant-numeric: tabular-nums; }
    .pm-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .pm-num b { font-weight: 700; }
    .pm-state { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 600; }
    .pm-mark { width: 8px; height: 8px; border-radius: 2px; background: var(--kp-text-2); }
    .pm-state.is-ok .pm-mark { background: var(--kp-ok); }
    .pm-state.is-near { color: var(--kp-warn-ink); }
    .pm-state.is-near .pm-mark { background: var(--kp-warn); }
    .pm-state.is-over { color: var(--kp-over-ink); }
    .pm-state.is-over .pm-mark { background: var(--kp-over); }
    .pm-state.is-burst { color: var(--kp-pending-ink); }
    .pm-state.is-burst .pm-mark { background: var(--kp-pending); }
    .pm-state.is-quiet { color: var(--kp-text-2); font-weight: 400; }
    .pm-over b { color: var(--kp-over-ink); }
    .c-heat { width: 1%; }

    .heat { display: grid; grid-template-columns: repeat(24, 7px); grid-auto-rows: 7px; gap: 1px; }
    .heat i, .heat-days i, .heat-legend i { display: block; border-radius: 1.5px; background: color-mix(in srgb, var(--kp-text) 8%, transparent); }
    .heat i.l1, .heat-days i.l1, .heat-legend i.l1 { background: color-mix(in srgb, var(--kp-accent) 28%, var(--kp-surface)); }
    .heat i.l2, .heat-days i.l2, .heat-legend i.l2 { background: color-mix(in srgb, var(--kp-accent) 48%, var(--kp-surface)); }
    .heat i.l3, .heat-days i.l3, .heat-legend i.l3 { background: color-mix(in srgb, var(--kp-accent) 72%, var(--kp-surface)); }
    .heat i.l4, .heat-days i.l4, .heat-legend i.l4 { background: var(--kp-accent); }

<script>
const API = String(window.CPA_KEY_POLICY_PLUS_API_BASE || "/key-policy-plus/api").replace(/\/$/, "");
const WINDOWS = [
  {name:"5h", label:"5 小时", field:"five_hour_usd"},
  {name:"24h", label:"24 小时", field:"daily_usd"},
  {name:"7d", label:"7 天", field:"weekly_usd"},
  {name:"month", label:"本月", field:"monthly_usd"}
];
const RESETS = [["5h", "清 5H"], ["24h", "清 24H"], ["7d", "清 7D"], ["month", "清本月"], ["all", "清全部"]];
const state = {
  keys: [],
  edits: {},
  modelOptions: [],
  modelWarnings: [],
  pricing: null,
  cpampAlias: null,
  expanded: "",
  picker: "",
  pickerSearch: "",
  search: "",
  armed: {},
  notes: {},
  lastSync: 0,
  pollTimer: null,
  poolData: null,
  poolsUnavailable: false,
  poolChart: {},
  poolIndex: {},
  poolOpenMember: {},
  poolEdit: null,
  burstPick: {},
  poolArmed: {}
};
const $ = id => document.getElementById(id);

function escapeHTML(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(v, digits=2){
  if (v === null || v === undefined || v === "") return "未设";
  const n = Number(v);
  return Number.isFinite(n) ? "$" + n.toFixed(digits) : "未设";
}
function limitInputValue(v){
  if (v === null || v === undefined || v === "") return "";
  const n = Number(v);
  return Number.isFinite(n) ? String(Math.round(n * 1000) / 1000) : "";
}
function domId(id){ return String(id).replace(/[^a-zA-Z0-9_-]/g, "_"); }
function relTime(ms){
  const minutes = Math.round((Date.now() - Number(ms)) / 60000);
  if (!Number.isFinite(minutes) || minutes < 1) return "刚刚";
  if (minutes < 60) return `${minutes} 分钟前`;
  if (minutes < 48 * 60) return `${Math.round(minutes / 60)} 小时前`;
  return `${Math.round(minutes / 1440)} 天前`;
}
function reasonText(reason){
  const text = ({
    model_price_unavailable: "模型价格缺失",
    cpamp_price_unavailable: "CPAMP 价格不可用",
    billing_price_unavailable: "计费价格不可用",
    model_or_service_tier_price_unavailable: "模型或服务等级价格缺失"
  })[reason];
  return text ? `${text}（${reason}）` : (reason || "价格规则待核验");
}
function whenLabel(unix){
  const d = new Date(Number(unix) * 1000);
  const minutes = Math.round((d.getTime() - Date.now()) / 60000);
  const hm = `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  if (minutes < 60) return `${hm}（约 ${Math.max(minutes, 1)} 分钟后）`;
  if (minutes < 24 * 60) return `${hm}（约 ${Math.round(minutes / 60)} 小时后）`;
  return `${d.getMonth() + 1}月${d.getDate()}日 ${hm}`;
}
function setSync(text, cls="info"){
  $("sync").dataset.state = cls;
  $("sync").querySelector("b").textContent = text;
}
function setButtonState(btn, stateText, cls){
  if (!btn) return () => {};
  const original = btn.dataset.originalText || btn.textContent;
  btn.dataset.originalText = original;
  btn.textContent = stateText || original;
  btn.classList.remove("is-busy", "is-done");
  if (cls) btn.classList.add(cls);
  if (cls === "is-busy") btn.disabled = true;
  return () => {
    btn.classList.remove("is-busy", "is-done");
    btn.disabled = false;
    btn.textContent = original;
  };
}
function flashButton(btn, text="已完成"){
  if (!btn) return;
  const restore = setButtonState(btn, text, "is-done");
  window.setTimeout(restore, 820);
}
async function withButtonFeedback(btn, busyText, doneText, fn){
  const restore = setButtonState(btn, busyText, "is-busy");
  try {
    const result = await fn();
    restore();
    flashButton(btn, doneText);
    return result;
  } catch (e) {
    restore();
    throw e;
  }
}
async function api(path, opts={}){
  const r = await fetch(API + path, {cache:"no-store", credentials:"same-origin", ...opts});
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (!r.ok || !d.ok) throw Object.assign(new Error(d.message || d.error || `HTTP ${r.status}`), {status:r.status, data:d});
  return d;
}

/* Key helpers */
function limitsOf(k){ return k.limits || {}; }
function usageOf(k){ return k.usage || {}; }
function selectedModels(k){ return Array.isArray(k.models) ? [...k.models] : []; }
function pricedModelSet(){
  return new Set(((state.pricing && state.pricing.models) || []).map(m => String(m || "").toLowerCase()));
}
function sourceLabel(source){
  source = String(source || "");
  if (source === "cpa_registry") return "CPA 发现";
  if (source === "host_auth") return "Auth 提示";
  if (source === "plus_configured") return "Plus 已配置";
  return source || "未知来源";
}
function optionMeta(o){
  const parts = [];
  if (o.provider) parts.push(o.provider);
  if (o.auth_name) parts.push(o.auth_name);
  parts.push(sourceLabel(o.source));
  return parts.filter(Boolean).join(" · ");
}
function hasGlobalModelPrice(model){ return pricedModelSet().has(String(model || "").toLowerCase()); }
function findKey(id){ return state.keys.find(k => k.id === id); }
function visibleKeys(){ return state.keys.filter(k => !k.hidden && k.source_present !== false); }
function effective(k){
  const e = state.edits[k.id];
  if (!e) return k;
  return {
    ...k,
    enabled: e.enabled ?? k.enabled,
    rpm: e.rpm ?? k.rpm,
    models: e.models ?? k.models,
    limits: e.limits ? {...limitsOf(k), ...e.limits} : k.limits
  };
}
function editOf(id){ return state.edits[id] || (state.edits[id] = {}); }
function sameModels(a, b){
  const left = [...new Set((a || []).map(String))].sort();
  const right = [...new Set((b || []).map(String))].sort();
  return left.length === right.length && left.every((v, i) => v === right[i]);
}
function sameLimit(a, b){
  const na = a === null || a === undefined || a === "" ? null : Number(a);
  const nb = b === null || b === undefined || b === "" ? null : Number(b);
  return na === nb;
}
function isDirty(id){
  const k = findKey(id);
  const e = state.edits[id];
  if (!k || !e) return false;
  const next = effective(k);
  if (Boolean(next.enabled) !== Boolean(k.enabled)) return true;
  if (Number(next.rpm || 0) !== Number(k.rpm || 0)) return true;
  if (!sameModels(next.models, k.models)) return true;
  return WINDOWS.some(w => !sameLimit(limitsOf(next)[w.field], limitsOf(k)[w.field]));
}
function dirtyIds(){ return Object.keys(state.edits).filter(isDirty); }
function hasAnyLimit(k){
  const limits = limitsOf(k);
  return WINDOWS.some(w => limits[w.field] !== null && limits[w.field] !== undefined && limits[w.field] !== "");
}
function isWeeklyOnly(k){
  const limits = limitsOf(k);
  const set = (f) => limits[f] !== null && limits[f] !== undefined && limits[f] !== "";
  return set("weekly_usd") && !set("five_hour_usd") && !set("daily_usd") && !set("monthly_usd");
}
function billingHoldOf(k){ return k.billing_hold || {}; }
function policyWarnings(k){
  const warnings = [];
  if (Number(k.rpm || 0) <= 0) warnings.push("未配置 RPM");
  const pool = k.pool || {};
  if (!hasAnyLimit(k) && pool.role !== "member" && pool.role !== "owner") warnings.push("未配置费用限额");
  const billingHold = billingHoldOf(k);
  if (billingHold.active) warnings.push(`费用待核算：${billingHold.model || "未知模型"}（${billingHold.reason || "价格规则待核验"}）`);
  return warnings;
}
function quotaOf(k, w){
  const used = Number(usageOf(k)[w.name] ?? 0);
  const limit = limitsOf(k)[w.field];
  const has = limit !== null && limit !== undefined && limit !== "";
  const max = has ? Number(limit) : null;
  return {
    used,
    limit: has ? max : null,
    remaining: has ? Math.max(max - used, 0) : null,
    percent: has ? (max > 0 ? used / max : (used >= max ? 1 : 0)) : null
  };
}
function missingPriceModels(k){ return selectedModels(k).filter(m => !hasGlobalModelPrice(m)); }
function modelCountText(k){
  const models = selectedModels(k);
  return models.length ? `${models.length} 个模型` : "允许全部模型";
}
function displayPreview(v){ return String(v || "").replace(/\.\.\./g, "…"); }
function keyName(k){ return k.name || k.alias || displayPreview(k.preview) || k.id; }
function matchesSearch(k){
  const q = state.search.trim().toLowerCase();
  if (!q) return true;
  return [k.name, k.alias, k.preview, displayPreview(k.preview), k.id].some(v => String(v || "").toLowerCase().includes(q));
}
function nullableNumber(raw){
  raw = String(raw ?? "").trim();
  if (raw === "") return null;
  const n = Number(raw);
  if (!Number.isFinite(n) || n < 0) throw new Error("数字字段不能为负或非法");
  return n;
}
function cleanStrings(items){
  const seen = new Set();
  const out = [];
  for (const item of items || []) {
    const text = String(item || "").trim();
    const key = text.toLowerCase();
    if (!text || seen.has(key)) continue;
    seen.add(key);
    out.push(text);
  }
  return out;
}
function keyPayload(k){
  const limits = limitsOf(k);
  return {
    id: k.id,
    enabled: !!k.enabled,
    rpm: nullableNumber(k.rpm) || 0,
    concurrency: 0,
    max_active_sessions: 0,
    models: cleanStrings(k.models || []),

function inboxItems(){
  const items = [];
  for (const raw of visibleKeys()) {
    const k = effective(raw);
    const name = keyName(k);
    const hold = billingHoldOf(raw);
    if (hold.active) {
      items.push({sev:"pending", id:k.id, name, text:`费用待核算 · ${hold.model || "未知模型"} ${reasonText(hold.reason)}，新请求已暂停`, action:"resolve", label:"重新结算"});
    }
    const missing = [];
    if (Number(k.rpm || 0) <= 0) missing.push("RPM");
    const pool = raw.pool || {};
    if (!hasAnyLimit(k) && pool.role !== "member" && pool.role !== "owner") missing.push("费用额度");
    if (missing.length) items.push({sev:"warn", id:k.id, name, text:`未配置 ${missing.join(" 和 ")}`, action:"edit", label:"去设置"});
    for (const w of pool.usd_windows_off ? [] : WINDOWS) {
      const q = quotaOf(raw, w);
      if (q.limit === null) continue;
      const row = (raw.quota || {})[w.name] || {};
      if (q.percent >= 1) {
        const when = w.name === "month" ? row.resets_at : row.recovers_at;
        items.push({sev:"over", id:k.id, name, text:`${w.label}额度已用完 · ${money(q.used)} / ${money(q.limit)}${when ? ` · ${w.name === "month" ? "下月 1 日重置" : "预计 " + whenLabel(when) + " 恢复"}` : ""}`, action:"view", label:"查看"});
      } else if (q.percent >= .8) {
        items.push({sev:"warn", id:k.id, name, text:`${w.label}额度已用 ${Math.round(q.percent * 100)}% · 剩 ${money(q.remaining)}`, action:"view", label:"查看"});
      }
    }
    const missingPrices = missingPriceModels(k);
    if (missingPrices.length) items.push({sev:"warn", id:k.id, name, text:`${missingPrices.length} 个白名单模型未在 CPAMP 配置价格：${missingPrices.join("、")}`, action:"view", label:"查看"});
    if (raw.inherit_conflict) items.push({sev:"warn", id:k.id, name, text:"同名历史策略存在多条候选，请人工确认模板", action:"view", label:"查看"});
  }
  items.push(...poolInboxItems());
  const order = {over:0, pending:1, warn:2};
  return items.sort((a, b) => order[a.sev] - order[b.sev]);
}
function renderInbox(){
  const items = inboxItems();
  $("inboxCount").textContent = items.length ? String(items.length) : "";
  if (!state.keys.length) {
    $("inbox").innerHTML = "";
    return;
  }
  if (!items.length) {
    $("inbox").innerHTML = `<li class="todo todo-clear"><div class="todo-main">没有需要处理的事项。</div></li>`;
    return;
  }
  $("inbox").innerHTML = items.map((item, index) => `<li class="todo sev-${item.sev}">
    <div class="todo-mark" aria-hidden="true"></div>

    <button class="btn${item.action === "resolve" ? " primary" : ""}" type="button" data-todo="${index}">${escapeHTML(item.label)}</button>
  </li>`).join("");
  $("inbox").querySelectorAll("[data-todo]").forEach(btn => btn.onclick = (e) => {

const POOL_VIS = [["anonymous", "匿名"], ["named", "实名"], ["self", "只看自己"]];
const usdFormat = new Intl.NumberFormat("en-US", {maximumFractionDigits: 0});
const bjFormat = new Intl.DateTimeFormat("zh-CN", {timeZone:"Asia/Shanghai", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false});
const bjPartsFormat = new Intl.DateTimeFormat("en-US", {timeZone:"Asia/Shanghai", month:"numeric", day:"numeric", hour:"numeric", hourCycle:"h23", weekday:"short"});
const BJ_WEEKDAY = {Sun:"周日", Mon:"周一", Tue:"周二", Wed:"周三", Thu:"周四", Fri:"周五", Sat:"周六"};
const BJ_OFFSET_MS = 8 * 3600000;
function bjParts(ms){
  const p = Object.fromEntries(bjPartsFormat.formatToParts(new Date(ms)).map(x => [x.type, x.value]));
  return {month: Number(p.month), day: Number(p.day), hour: Number(p.hour) % 24, weekday: BJ_WEEKDAY[p.weekday] || ""};
}
function usd(v){ const n = Number(v); return Number.isFinite(n) ? "$" + usdFormat.format(n) : "—"; }
function pp(v, digits=2){ const n = Number(v); return Number.isFinite(n) ? n.toFixed(digits) + "%" : "—"; }
function signedPP(v){ const n = Number(v || 0); return (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(2); }
function bjLabel(unix){
  if (!unix) return "—";
  const p = Object.fromEntries(bjFormat.formatToParts(new Date(Number(unix) * 1000)).map(x => [x.type, x.value]));
  return `${p.month}月${p.day}日 ${p.hour}:${p.minute}`;
}
function untilLabel(unix){
  const minutes = Math.round((Number(unix) * 1000 - Date.now()) / 60000);
  if (!Number.isFinite(minutes)) return "";
  if (minutes <= 0) return "已到时间";
  if (minutes < 60) return `约 ${minutes} 分钟后`;
  if (minutes < 48 * 60) return `约 ${Math.round(minutes / 60)} 小时后`;
  return `约 ${Math.round(minutes / 1440)} 天后`;
}
function planLabel(plan){
  const p = String(plan || "").toLowerCase();
  return ({pro:"Pro", plus:"Plus", team:"Team", business:"Business", enterprise:"Enterprise", free:"Free"})[p] || (p ? p : "未知套餐");
}
function poolKeysMap(){
  const map = new Map();
  for (const k of ((state.poolData || {}).keys || [])) map.set(k.id, k);

}
function poolAccount(authIndex){

}
function accountText(a){

function memberStateOf(row){
  if (row.role === "owner") return {cls:"quiet", text:"车主"};
  if (row.role === "outside") return {cls:"quiet", text:"池外"};
  if (row.role === "pinned") return {cls:"quiet", text:"固定路由"};

  if (burstRunning(row.burst)) return {cls:"burst", text:"爽蹬中"};
  return ({ok:{cls:"ok", text:"正常"}, near:{cls:"near", text:"快用完"}, over:{cls:"over", text:"已拦截"}})[row.state] || {cls:"quiet", text:"—"};
}
function heatThresholds(p){
  const values = [];
  for (const row of p.rows || []) for (const v of ((row.heat || {}).hours || [])) if (v > 0) values.push(v);
  values.sort((a, b) => a - b);
  const q = f => values.length ? values[Math.min(values.length - 1, Math.floor(values.length * f))] : 0;
  return [q(.25), q(.5), q(.75)];
}
function heatLevel(v, t){
  if (!(v > 0)) return 0;
  if (v <= t[0]) return 1;
  if (v <= t[1]) return 2;
  if (v <= t[2]) return 3;
  return 4;
}
function heatGridHTML(p, row, t){
  const hours = (row.heat || {}).hours || [];
  const start = Number((p.heat || {}).hours_start_ms || 0);
  const now = Date.now();
  let total = 0, best = -1;
  const cells = hours.map((v, i) => {
    const at = start + i * 3600000;
    total += v;
    if (best < 0 || v > hours[best]) best = i;
    if (at > now) return `<i class="is-future"></i>`;
    const lvl = heatLevel(v, t);
    const b = bjParts(at);
    const label = `${b.month}月${b.day}日 ${String(b.hour).padStart(2, "0")}:00 · ${money(v)}`;
    return `<i class="${lvl ? "l" + lvl : ""}" title="${escapeHTML(label)}"></i>`;
  }).join("");
  const bestAt = best >= 0 && hours[best] > 0 ? bjParts(start + best * 3600000) : null;
  const summary = total > 0 ? `近 7 天共 ${money(total)}${bestAt ? `，最高在 ${bestAt.month}月${bestAt.day}日 ${bestAt.hour} 点（北京时间）` : ""}` : "近 7 天没有花费";
  return `<div class="heat" role="img" aria-label="${escapeHTML(summary)}" title="${escapeHTML(summary + "。点这一行看近 30 天")}">${cells}</div>`;
}
function heatDaysHTML(p, row){

  const start = Number((p.heat || {}).days_start_ms || 0);
  const nonzero = days.filter(v => v > 0).sort((a, b) => a - b);
  const q = f => nonzero.length ? nonzero[Math.min(nonzero.length - 1, Math.floor(nonzero.length * f))] : 0;
  const t = [q(.25), q(.5), q(.75)];
  let total = 0, best = -1;
  const cells = days.map((v, i) => {
    total += v;
    if (best < 0 || v > days[best]) best = i;
    const at = bjParts(start + i * 86400000);
    return `<i class="${heatLevel(v, t) ? "l" + heatLevel(v, t) : ""}" title="${escapeHTML(`${at.month}月${at.day}日 ${at.weekday} · ${money(v)}`)}"></i>`;
  }).join("");
  const axis = days.map((_, i) => {
    const at = bjParts(start + i * 86400000);
    const last = i === days.length - 1;
    return `<div>${last || (i % 7 === 0 && days.length - 1 - i > 3) ? `${at.month}/${at.day}` : ""}</div>`;
  }).join("");
  const bestAt = best >= 0 && days[best] > 0 ? bjParts(start + best * 86400000) : null;
  const active = days.filter(v => v > 0).length;
  return `<div class="days-wrap">
    <div class="days-head"><div>近 30 天 <b>${money(total)}</b> · ${active} 天有花费${bestAt ? ` · 最高 ${bestAt.month}月${bestAt.day}日 ${money(days[best])}` : ""}</div>

}

function settlementLine(p){

/* Charts */
function niceAxis(lo, hi){
  const span = Math.max(hi - lo, 1);
  const step = Math.pow(10, Math.floor(Math.log10(span / 3)));
  const mult = [1, 2, 2.5, 5, 10].find(m => span / (step * m) <= 4) || 10;
  const s = step * mult;
  const ticks = [];
  for (let v = Math.ceil(lo / s) * s; v <= hi + 1e-9; v += s) ticks.push(v);
  return ticks;
}
function chartSeries(p, kind){
  if (kind === "month") {
    return (p.month_line || []).map((d, i) => ({i, t: d.t, usd: d.close_usd > 0 ? d.close_usd : null, low: d.close_low, high: d.close_high, day: d.day_usd > 0 ? d.day_usd : null, used: d.has_used ? d.used : null, label: d.day}));
  }
  return (p.week_line || []).map((d, i) => ({i, t: d.t, usd: d.usd, low: d.low, high: d.high, used: d.used}));
}
function chartTip(p, kind, point){
  if (!point) return "";
  if (kind === "month") {
    const date = bjParts(point.t);
    const parts = [`${date.month}月${date.day}日 ${date.weekday}`];
    parts.push(point.usd ? `收盘 100% ≈ ${usd(point.usd)}` : "没有收盘");
    if (point.day) parts.push(`当日单日 ${usd(point.day)}`);
    if (point.used != null) parts.push(`周限已用 ${Math.round(point.used)}%`);
    return parts.join(" · ");
  }
  const range = point.low > 0 ? `（${usdFormat.format(point.low)}–${point.high > 0 ? usdFormat.format(point.high) : "?"}）` : "";
  return `${bjLabel(Math.floor(point.t / 1000))} · 100% ≈ ${usd(point.usd)}${range} · 周限已用 ${Math.round(point.used)}%`;
}
function drawChart(el, p){
  const kind = state.poolChart[p.id] || "week";
  const series = chartSeries(p, kind);
  const W = Math.max(el.clientWidth, 240), H = el.clientHeight || 150;
  const padL = 50, padR = 12, padT = 10, padB = 20;
  const c = p.cycle || {};
  let x0, x1;
  if (kind === "week") {
    x1 = c.reset_at ? c.reset_at * 1000 : Date.now();
    x0 = c.reset_at && c.window_minutes ? x1 - c.window_minutes * 60000 : (series[0] ? series[0].t : x1 - 7 * 86400000);
  } else {
    x0 = 0; x1 = Math.max(series.length - 1, 1);
  }
  const xOf = v => padL + (W - padL - padR) * ((kind === "week" ? v.t : v.i) - x0) / Math.max(x1 - x0, 1);
  const prior = kind === "week" && !series.length ? Number((c.capacity || {}).usd) || 0 : 0;
  const vals = prior ? [prior] : series.flatMap(s => [s.usd, s.day]).filter(v => v > 0);
  if (!vals.length) { el.innerHTML = ""; return; }
  const sorted = [...vals].sort((a, b) => a - b);
  const mid = sorted[Math.floor(sorted.length / 2)];
  let lo = Math.max(Math.min(...vals), mid * .6), hi = Math.min(Math.max(...vals), mid * 1.6);
  for (const s of series) {
    if (s.low > 0) lo = Math.min(lo, Math.max(s.low, mid * .6));
    if (s.high > 0) hi = Math.max(hi, Math.min(s.high, mid * 1.6));
  }
  const pad = Math.max((hi - lo) * .08, mid * .02);
  lo = Math.max(0, lo - pad); hi = hi + pad;
  const yOf = v => padT + (H - padT - padB) * (1 - (Math.min(Math.max(v, lo), hi) - lo) / Math.max(hi - lo, 1));
  const parts = [];
  for (const tick of niceAxis(lo, hi)) {
    const y = yOf(tick).toFixed(1);
    parts.push(`<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"></line><text class="ch-axis" x="${padL - 6}" y="${Number(y) + 4}" text-anchor="end">$${usdFormat.format(tick)}</text>`);
  }
  if (kind === "week") {
    const dayMs = 86400000;
    const first = Math.ceil((x0 + BJ_OFFSET_MS) / dayMs) * dayMs - BJ_OFFSET_MS;
    for (let t = first; t < x1; t += dayMs) {
      const x = xOf({t});
      if (x > W - padR - 16) break;
      parts.push(`<line class="ch-grid" x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${H - padB}" y2="${H - padB + 4}"></line><text class="ch-axis" x="${(x + (xOf({t: t + dayMs}) - x) / 2).toFixed(1)}" y="${H - 4}" text-anchor="middle">${escapeHTML(bjParts(t + 12 * 3600000).weekday)}</text>`);
    }
    const now = Date.now();
    if (now > x0 && now < x1) {
      const x = xOf({t: now}).toFixed(1);
      parts.push(`<line class="ch-now" x1="${x}" x2="${x}" y1="${padT}" y2="${H - padB}"></line>`);
    }
    const banded = series.filter(s => s.low > 0);
    if (banded.length > 1) {
      const top = banded.map(s => `${xOf(s).toFixed(1)},${yOf(s.high > 0 ? s.high : hi).toFixed(1)}`);
      const bottom = banded.slice().reverse().map(s => `${xOf(s).toFixed(1)},${yOf(s.low).toFixed(1)}`);
      parts.push(`<polygon class="ch-band" points="${top.concat(bottom).join(" ")}"></polygon>`);
    }
  } else {
    series.forEach((s, i) => {
      if (i === series.length - 1 || (i % 7 === 0 && series.length - 1 - i > 3)) {
        const d = bjParts(s.t);
        parts.push(`<text class="ch-axis" x="${xOf(s).toFixed(1)}" y="${H - 4}" text-anchor="${i === series.length - 1 ? "end" : i === 0 ? "start" : "middle"}">${d.month}/${d.day}</text>`);
      }
    });
    for (const s of series) if (s.day) parts.push(`<circle class="ch-day" cx="${xOf(s).toFixed(1)}" cy="${yOf(s.day).toFixed(1)}" r="2.6"></circle>`);
  }
  if (prior) {
    const y = yOf(prior).toFixed(1);
    parts.push(`<line class="ch-prior" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"></line><text class="ch-prior-label" x="${padL + 6}" y="${Number(y) - 6}">估算 100% ≈ ${escapeHTML(usd(prior))}</text>`);
    el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${parts.join("")}</svg>`;
    el.setAttribute("aria-label", `本周期还没有实测，按估算 100% ≈ ${usd(prior)}。`);
    el._series = [];
    el._xOf = xOf;
    const tip = document.getElementById(`tip-${domId(p.id)}`);
    if (tip) tip.textContent = `估算 100% ≈ ${usd(prior)} · ${capacityBasisText(c.capacity) || "估算"} · 周限已用 ${Math.round(Number(c.used_percent || 0))}%`;
    return;
  }
  let path = "", open = false;
  for (const s of series) {
    if (!(s.usd > 0)) { open = false; continue; }
    path += `${open ? "L" : "M"}${xOf(s).toFixed(1)},${yOf(s.usd).toFixed(1)}`;
    open = true;
  }
  parts.push(`<path class="ch-line" d="${path}"></path>`);
  const withValue = series.filter(s => s.usd > 0);
  const last = withValue[withValue.length - 1];
  if (last) parts.push(`<circle class="ch-dot" cx="${xOf(last).toFixed(1)}" cy="${yOf(last.usd).toFixed(1)}" r="3.5"></circle>`);
  const index = Math.min(state.poolIndex[p.id] ?? -1, series.length - 1);
  const focus = index >= 0 ? series[index] : null;
  if (focus) {
    const x = xOf(focus).toFixed(1);
    parts.push(`<line class="ch-guide" x1="${x}" x2="${x}" y1="${padT}" y2="${H - padB}"></line>`);
    if (focus.usd > 0) parts.push(`<circle class="ch-focus" cx="${x}" cy="${yOf(focus.usd).toFixed(1)}" r="4.5"></circle>`);
  }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">${parts.join("")}</svg>`;
  el.setAttribute("aria-label", kind === "week"
    ? `本周期折算走势，最新 100% ≈ ${last ? usd(last.usd) : "—"}。用左右方向键逐点查看。`
    : `近 30 天每日收盘，最新 ${last ? usd(last.usd) : "—"}。用左右方向键逐日查看。`);
  el._series = series;
  el._xOf = xOf;
  const tip = document.getElementById(`tip-${domId(p.id)}`);
  if (tip) tip.textContent = chartTip(p, kind, focus || last);
}
function drawPoolCharts(){
  document.querySelectorAll("[data-plot]").forEach(el => {
    const p = ((state.poolData || {}).pools || []).find(x => x.id === el.dataset.plot);
    if (p) drawChart(el, p);
  });
}
function scrubChart(el, clientX){
  const series = el._series || [];
  if (!series.length) return;
  const rect = el.getBoundingClientRect();
  const x = clientX - rect.left;
  let best = 0;
  series.forEach((s, i) => { if (Math.abs(el._xOf(s) - x) < Math.abs(el._xOf(series[best]) - x)) best = i; });
  state.poolIndex[el.dataset.plot] = best;
  const p = ((state.poolData || {}).pools || []).find(q => q.id === el.dataset.plot);
  if (p) drawChart(el, p);
}

/* Pool actions */
async function savePools(pools, btn, doneText){
  const run = async () => {
    const resp = await api("/pools/save", {method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pools})});
    state.poolData = resp;
    state.poolEdit = null;
    state.poolArmed = {};
    setSync(doneText || "拼车池已保存", "ok");
    render();
  };
  try {
    await withButtonFeedback(btn, "保存中", "已保存", run);
  } catch (e) {
    if (state.poolEdit) state.poolEdit.error = "保存失败：" + ((e.data || {}).message || e.message);
    setSync("拼车池保存失败", "bad");
    renderPools();
  }
}
function saveDraft(btn){
  const edit = state.poolEdit;
  const d = edit.draft;
  const name = String(d.name || "").trim();
  if (!name) { edit.error = "请填写名称。"; renderPools(); return; }
  if (d.members.some(m => !m.key_id)) { edit.error = "有成员还没选 Key。"; renderPools(); return; }
  for (const m of d.members) {
    if (m.share_percent == null) continue;
    const n = Number(m.share_percent);
    if (String(m.share_percent).trim() === "" || !Number.isFinite(n) || n < 0 || n > 100) { edit.error = "份额要填 0 到 100 之间的数字。"; renderPools(); return; }
    m.share_percent = n;
  }
  if (shareTotal(d) > 100 + 1e-9) { edit.error = "份额合计不能超过 100%。"; renderPools(); return; }
  const prefix = String(d.model_prefix || "").trim();
  if (prefix && !/^[A-Za-z0-9][A-Za-z0-9._-]{0,31}$/.test(prefix)) { edit.error = "模型前缀只能用字母、数字、.、- 和 _，不能带 /。"; renderPools(); return; }
  const input = {...d, name, model_prefix: prefix, id: d.id || poolSlug({...d, model_prefix: prefix}), sub2pool_account_id: Number(d.sub2pool_account_id) || 0};
  const others = ((state.poolData || {}).pools || []).filter(p => p.id !== d.id).map(poolInputFrom);
  savePools(edit.isNew ? others.concat([input]) : ((state.poolData || {}).pools || []).map(p => p.id === d.id ? input : poolInputFrom(p)), btn, edit.isNew ? "拼车池已创建" : "拼车池已保存");
}
function deletePool(btn){
  const d = state.poolEdit.draft;
  const key = `${d.id}:delete`;
  if (!state.poolArmed[key]) {
    state.poolArmed[key] = setTimeout(() => { delete state.poolArmed[key]; renderPools(); }, 4000);
    renderPools();
    return;
  }
  clearTimeout(state.poolArmed[key]);
  savePools(((state.poolData || {}).pools || []).filter(p => p.id !== d.id).map(poolInputFrom), btn, "拼车池已删除");
}
async function burstAction(pk, body, btn){
  const [poolId, keyId] = pk.split("|");
  try {
    await withButtonFeedback(btn, body.action === "stop" ? "停止中" : "开启中", body.action === "stop" ? "已停止" : "已开启", async () => {
      const resp = await api("/pools/burst", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({pool_id: poolId, key_id: keyId, confirm: true, ...body})});
      state.poolData = resp;
    });
    delete state.burstPick[pk];
    state.poolArmed = {};
    setSync(body.action === "stop" ? "爽蹬已停止" : "爽蹬已开启", "ok");
  } catch (e) {
    setSync("爽蹬操作失败：" + ((e.data || {}).message || e.message), "bad");
  }
  render();
}
function scrollToPool(id){
  const el = document.getElementById(`pool-${domId(id)}`);
  if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"});
}
function poolInboxItems(){
  const items = [];
  for (const p of ((state.poolData || {}).pools || [])) {
    const c = p.cycle || {};
    for (const row of p.rows || []) {
      if (row.role !== "member" || burstRunning(row.burst)) continue;
      if (row.state === "over") items.push({sev:"over", pool:p.id, name:row.label, text:`在「${p.name}」的份额已用完 · 已用 ${pp(row.used_pp)} / 可用 ${pp(row.available_pp)} · ${bjLabel(c.reset_at)} 重置`, action:"pool", label:"查看"});
      else if (row.state === "near") items.push({sev:"warn", pool:p.id, name:row.label, text:`在「${p.name}」的份额只剩 ${pp(row.remaining_pp)}${row.remaining_usd != null ? `（≈ ${usd(row.remaining_usd)}）` : ""}`, action:"pool", label:"查看"});
    }
    if (c.used_percent >= 95) items.push({sev:"over", pool:p.id, name:p.name, text:`账号本周已用 ${Math.round(c.used_percent)}%，${bjLabel(c.reset_at)} 重置`, action:"pool", label:"查看"});
    for (const w of p.warnings || []) items.push({sev:"warn", pool:p.id, name:p.name, text:w, action:"pool", label:"查看"});
  }
  return items;
}

            return `<label class="ed-win"><div class="ed-label">${w.label}</div>
              <input class="input num" type="number" min="0" step="0.01" inputmode="decimal" placeholder="不限" data-limit="${w.field}" value="${limitInputValue(limit)}"${dis}>
              <output class="ed-proj ${p.cls}" data-proj="${w.field}">${escapeHTML(p.text)}</output></label>`;
          }).join("")}</div>
          <div class="ed-hint${(raw.pool || {}).usd_windows_off ? " st-warn" : ""}">${(raw.pool || {}).usd_windows_off ? `按「${escapeHTML(raw.pool.pool)}」份额计，金额窗口暂停。` : "留空为不限。"}</div>
        </section>
      </div>
      <section class="ed-block">
        <div class="ed-models-head"><h3>模型白名单</h3><b data-model-count>${escapeHTML(modelCountText(k))}</b><button class="btn" type="button" data-models="${id}"${dis}>${pickerOpen ? "收起模型列表" : "编辑模型白名单"}</button></div>
        <div class="chips" data-model-chips>${chipsHTML(k, pickerOpen && !readonly)}</div>
        <div class="ed-hint${missing.length ? " st-warn" : ""}" data-model-hint>${missing.length ? `${missing.length} 个模型没有 CPAMP 价格。` : ""}</div>
        ${pickerOpen ? `<div class="picker">
          <div class="picker-tools">
            <input class="input" type="search" data-picker-search placeholder="搜索模型" aria-label="搜索模型" value="${escapeHTML(state.pickerSearch)}">
            <div class="picker-add"><input class="input" data-picker-add placeholder="手动添加模型名" aria-label="手动添加模型名"><button class="btn" type="button" data-picker-act="add">添加</button></div>
          </div>
          <div class="picker-actions">
            <button class="btn" type="button" data-picker-act="visible">全选当前结果</button>
            <button class="btn" type="button" data-picker-act="discovered">套用 CPA 发现模型</button>
            <button class="btn" type="button" data-picker-act="clear">清空选择</button>
            <div class="picker-source">${escapeHTML(state.modelWarnings.join(" "))}</div>
          </div>
          <div class="picker-warn" data-picker-warn>${pickerWarnHTML(k)}</div>
          <div class="picker-list" data-picker-list>${pickerListHTML(k)}</div>
        </div>` : ""}
      </section>
      <section class="ed-block">
        <h3>软重置</h3>
        <div class="ed-resets">${RESETS.map(([w, label]) => {
          const armed = state.armed[`${k.id}:${w}`];
          return `<button class="btn${armed ? " is-armed" : ""}" type="button" data-reset="${w}"${dis}>${armed ? `确认${label}？` : label}</button>`;
        }).join("")}</div>
        <div class="ed-hint">从现在起重新计算，不删除明细。</div>
      </section>
    </div>
  </td></tr>`;
}
function renderTable(){
  const all = visibleKeys();
  const list = all.filter(matchesSearch);
  $("keysCount").textContent = all.length ? (list.length === all.length ? String(all.length) : `${list.length}/${all.length}`) : "";
  const body = $("keys-body");
  const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.toggle : "";
  if (!all.length) {
    body.innerHTML = `<tr><td colspan="8" class="empty">暂无可显示策略。请先在 CPA/CPAMP 添加 Key，然后刷新同步。</td></tr>`;
    return;
  }
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="8" class="empty">没有名称或预览包含「${escapeHTML(state.search.trim())}」的 Key。</td></tr>`;
    return;
  }
  body.innerHTML = list.map(k => rowHTML(k) + (state.expanded === k.id ? editorHTML(k) : "")).join("");
  if (focusKey) {
    const again = body.querySelector(`[data-toggle="${CSS.escape(focusKey)}"]`);
    if (again) again.focus({preventScroll: true});
  }
  wireEditor();
}
function refreshRow(id){
  const raw = findKey(id);
  const row = $("keys-body").querySelector(`tr.key-row[data-key-id="${CSS.escape(id)}"]`);
  if (!raw || !row) return;
  const hadFocus = row.contains(document.activeElement);
  const tpl = document.createElement("template");
  tpl.innerHTML = rowHTML(raw).trim();
  row.replaceWith(tpl.content.firstElementChild);
  if (hadFocus) {
    const again = $("keys-body").querySelector(`[data-toggle="${CSS.escape(id)}"]`);
    if (again) again.focus({preventScroll: true});
  }
}
function refreshModelParts(id){
  const raw = findKey(id);
  const editor = document.querySelector(`[data-editor="${CSS.escape(id)}"]`);
  if (!raw || !editor) return;
  const k = effective(raw);
  const pickerOpen = state.picker === id;
  editor.querySelector("[data-model-count]").textContent = modelCountText(k);
  editor.querySelector("[data-model-chips]").innerHTML = chipsHTML(k, pickerOpen && raw.source_present !== false);
  const missing = missingPriceModels(k);
  const hint = editor.querySelector("[data-model-hint]");
  hint.classList.toggle("st-warn", missing.length > 0);
  hint.textContent = missing.length ? `${missing.length} 个模型没有 CPAMP 价格。` : "";
  const list = editor.querySelector("[data-picker-list]");
  if (list) list.innerHTML = pickerListHTML(k);
  const warn = editor.querySelector("[data-picker-warn]");
  if (warn) warn.innerHTML = pickerWarnHTML(k);
  refreshRow(id);
  afterEdit();
}
function setModels(id, models){
  const raw = findKey(id);
  if (!raw || raw.source_present === false) return;
  editOf(id).models = cleanStrings(models);
  refreshModelParts(id);
}
function wireEditor(){
  const editor = document.querySelector("[data-editor]");
  if (!editor) return;
  const id = editor.dataset.editor;
  editor.querySelectorAll("[data-edit]").forEach(input => {
    input.addEventListener(input.type === "checkbox" ? "change" : "input", () => {
      const raw = findKey(id);
      if (!raw || raw.source_present === false) return;
      if (input.dataset.edit === "enabled") editOf(id).enabled = input.checked;
      else {
        const n = Number(input.value || 0);
        const bad = !Number.isFinite(n) || n < 0 || !Number.isInteger(n);
        input.setAttribute("aria-invalid", bad ? "true" : "false");
        if (bad) return;
        editOf(id).rpm = n;
      }
      refreshRow(id);
      afterEdit();
    });
  });
  editor.querySelectorAll("[data-limit]").forEach(input => {
    input.addEventListener("input", () => {
      const raw = findKey(id);
      if (!raw || raw.source_present === false) return;
      let value;
      try { value = nullableNumber(input.value); } catch (_) { value = NaN; }
      const out = editor.querySelector(`[data-proj="${input.dataset.limit}"]`);
      const w = WINDOWS.find(item => item.field === input.dataset.limit);
      if (Number.isNaN(value)) {
        input.setAttribute("aria-invalid", "true");
        out.className = "ed-proj st-over";
        out.textContent = "请输入不小于 0 的数字";
        return;
      }
      input.setAttribute("aria-invalid", "false");
      const edit = editOf(id);
      edit.limits = {...(edit.limits || {}), [input.dataset.limit]: value};
      const used = Number(usageOf(raw)[w.name] || 0);
      const p = (raw.pool || {}).usd_windows_off ? {text:`已用 ${money(used)} · 暂不生效`, cls:""} : projection(used, value);
      out.className = `ed-proj ${p.cls}`;
      out.textContent = p.text;
      refreshRow(id);
      afterEdit();
    });
  });
  editor.querySelectorAll("[data-reset]").forEach(btn => btn.onclick = () => armOrReset(id, btn.dataset.reset, btn));
  const resolve = editor.querySelector("[data-resolve]");
  if (resolve) resolve.onclick = () => resolveBilling(id, resolve);
  const modelsBtn = editor.querySelector("[data-models]");
  if (modelsBtn) modelsBtn.onclick = () => {
    state.picker = state.picker === id ? "" : id;
    state.pickerSearch = "";
    renderTable();
    const search = document.querySelector("[data-picker-search]");
    if (search) search.focus();
  };
  editor.addEventListener("click", (e) => {
    const remove = e.target.closest("[data-remove-model]");
    if (remove) {
      const k = effective(findKey(id));
      setModels(id, selectedModels(k).filter(m => m !== remove.dataset.removeModel));
      return;
    }
    const act = e.target.closest("[data-picker-act]");
    if (act) pickerAction(id, act.dataset.pickerAct, act);
  });
  editor.addEventListener("change", (e) => {
    const box = e.target.closest("[data-model-option]");
    if (!box) return;
    const k = effective(findKey(id));
    const set = new Set(selectedModels(k));
    if (box.checked) set.add(box.dataset.modelOption); else set.delete(box.dataset.modelOption);
    setModels(id, [...set]);
  });
  const search = editor.querySelector("[data-picker-search]");
  if (search) search.addEventListener("input", () => {
    state.pickerSearch = search.value;
    const list = editor.querySelector("[data-picker-list]");
    if (list) list.innerHTML = pickerListHTML(effective(findKey(id)));
  });
  const add = editor.querySelector("[data-picker-add]");
  if (add) add.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); pickerAction(id, "add", editor.querySelector('[data-picker-act="add"]')); }
  });
}
function pickerAction(id, action, btn){
  const k = effective(findKey(id));
  const current = selectedModels(k);
  if (action === "add") {
    const input = document.querySelector("[data-picker-add]");
    const value = input ? input.value.trim() : "";
    if (!value) return;
    input.value = "";
    setModels(id, [...current, value]);
    flashButton(btn, "已添加");
  } else if (action === "visible") {
    const visible = allModelOptions(current).filter(o => optionMatches(o, state.pickerSearch)).map(o => o.id);
    setModels(id, [...current, ...visible]);
    flashButton(btn, "已选择");
  } else if (action === "discovered") {
    const discovered = allModelOptions(current).filter(o => o.source === "cpa_registry" && o.known).map(o => o.id);
    if (!discovered.length) { flashButton(btn, "暂无发现"); return; }
    setModels(id, discovered);
    flashButton(btn, "已套用");
  } else if (action === "clear") {
    setModels(id, []);
    flashButton(btn, "已清空");
  }
}
function openEditor(id, focusField){
  const raw = findKey(id);
  if (!raw) return;
  if (state.search && !matchesSearch(raw)) { state.search = ""; $("keySearch").value = ""; }
  state.expanded = id;
  if (state.picker !== id) state.picker = "";
  renderTable();
  const row = $("keys-body").querySelector(`tr.key-row[data-key-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({block:"start", behavior:"smooth"});
  const target = focusField ? document.querySelector(`[data-editor="${CSS.escape(id)}"] [data-edit="${focusField}"], [data-editor="${CSS.escape(id)}"] [data-limit="${focusField}"]`) : null;
  if (target) target.focus({preventScroll: true});
}
function toggleRow(id){
  state.expanded = state.expanded === id ? "" : id;
  if (state.picker && state.picker !== state.expanded) state.picker = "";
  renderTable();
}

/* Save, reset, resolve */
function afterEdit(){
  renderMetrics();
  renderSavebar();
  setSync(dirtyIds().length ? "有未保存策略" : "已同步", dirtyIds().length ? "warn" : "ok");
}
function renderSavebar(){
  const ids = dirtyIds();
  $("savebar").hidden = !ids.length;
  if (!ids.length) return;
  const names = ids.map(id => keyName(findKey(id)));
  $("dirtyText").textContent = `${ids.length} 把 Key 有未保存改动：${names.join("、")}`;
}
function render(){
  renderMetrics();
  renderInbox();
  renderPools();
  renderTable();
  renderSavebar();
}
async function load(opts={}){
  const run = async () => {
    if (!opts.silent) setSync(opts.syncText || "同步中", "info");
    const [keys, models, pools] = await Promise.all([
      api("/keys"),
      api("/models").catch(e => ({ok:false, models:[], warnings:[e.message]})),
      api("/pools?tz_offset=-480").catch(e => ({ok:false, error:e}))
    ]);
    if (pools.ok) {
      state.poolData = pools;
      state.poolsUnavailable = false;
    } else if (pools.error && [404, 405].includes(pools.error.status)) {
      state.poolsUnavailable = true;
    }
    state.keys = keys.keys || [];
    state.modelOptions = models.models || [];
    state.pricing = keys.pricing || models.pricing || null;
    state.cpampAlias = keys.cpamp_alias || null;
    state.modelWarnings = [...(models.warnings || []), ...((state.pricing && state.pricing.warnings) || [])];
    Object.keys(state.edits).forEach(id => { if (!findKey(id)) delete state.edits[id]; });
    if (state.expanded && !findKey(state.expanded)) state.expanded = "";
    state.lastSync = Date.now();
    const dirty = dirtyIds().length;
    setSync(dirty ? "有未保存策略" : (opts.doneSyncText || "已同步"), dirty ? "warn" : "ok");
    render();
  };
  try {
    if (opts.button) await withButtonFeedback(opts.button, opts.busyText || "同步中", opts.doneText || "已更新", run);
    else await run();
  } catch(e) {
    setSync("同步失败：" + e.message, "bad");
    if (!state.keys.length) $("keys-body").innerHTML = `<tr><td colspan="8" class="empty">读取 Key 策略失败：${escapeHTML(e.message)}。确认 CPA 插件已加载后点「刷新」重试。</td></tr>`;
  }
}
async function saveAll(){
  const ids = dirtyIds();
  if (!ids.length) return;
  let payload;
  try {
    payload = ids.map(id => keyPayload(effective(findKey(id))));
  } catch (e) {
    setSync("保存失败：" + e.message, "bad");
    return;
  }
  const run = async () => {
    setSync("保存中", "info");
    const resp = await api("/keys/save", {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({keys: payload})
    });
    state.keys = resp.keys || state.keys;
    if (resp.pricing) state.pricing = resp.pricing;
    if (resp.cpamp_alias) state.cpampAlias = resp.cpamp_alias;
    state.edits = {};
    state.notes = {};
    setSync("已保存", "ok");
    render();
  };
  try {
    await withButtonFeedback($("save"), "保存中", "已保存", run);
  } catch(e) {
    setSync("保存失败：" + e.message, "bad");
  }
}
function discardAll(){
  state.edits = {};
  state.notes = {};
  render();
  setSync("已放弃改动", "ok");
}
function armOrReset(id, windowName, btn){
  const key = `${id}:${windowName}`;
  if (!state.armed[key]) {
    Object.values(state.armed).forEach(clearTimeout);
    state.armed = {[key]: setTimeout(() => { delete state.armed[key]; if (state.expanded === id) renderTable(); }, 4000)};
    renderTable();
    const again = document.querySelector(`[data-editor="${CSS.escape(id)}"] [data-reset="${windowName}"]`);
    if (again) again.focus();
    return;
  }
  clearTimeout(state.armed[key]);
  state.armed = {};
  resetSelected(id, windowName, btn);
}
async function resetSelected(id, windowName, btn){
  const key = findKey(id);
  if (!key) return;
  try {
    await withButtonFeedback(btn, "清零中", "已清零", () => api("/keys/reset", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id, window:windowName})
    }));
    state.notes[id] = {sev:"ok", text:`${windowName === "all" ? "全部窗口" : windowName} 已清零。`};
    await load({silent:true});
  } catch(e) {
    state.notes[id] = {sev:"over", text:"清零失败：" + e.message};
    setSync("清零失败：" + e.message, "bad");
    renderTable();
  }
}
async function resolveBilling(id, btn){
  try {
    const resp = await withButtonFeedback(btn, "结算中", "已结算", () => api("/keys/billing/resolve", {
      method:"PUT",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({id})
    }));
    state.notes[id] = {sev:"ok", text:`已重新结算 ${Number(resp.resolved_pending_events || 0)} 条待核算记录，这把 Key 恢复放行。`};
    setSync("已重新结算", "ok");
    await load({silent:true});
  } catch(e) {
    const code = e.data && e.data.error;
    const text = code === "billing_price_unavailable"
      ? "CPAMP 仍缺少这个模型的价格。请先在 CPAMP「用量分析 → 模型价格设置」补价或同步，再回来重新结算。"
      : code === "billing_hold_not_active" ? "这把 Key 已经没有待核算费用。" : "重新结算失败：" + e.message;
    state.notes[id] = {sev: code === "billing_hold_not_active" ? "ok" : "over", text};
    state.expanded = id;
    setSync(code === "billing_hold_not_active" ? "已同步" : "重新结算失败", code === "billing_hold_not_active" ? "ok" : "bad");
    if (code === "billing_hold_not_active") await load({silent:true}); else render();
  }
}
function schedulePoll(){
  clearInterval(state.pollTimer);
  state.pollTimer = setInterval(() => {
    if (document.hidden || state.expanded || dirtyIds().length || poolBusy()) return;
    load({silent:true});
  }, 30000);
}

$("keys-body").addEventListener("click", (e) => {
  const row = e.target.closest("tr.key-row");
  if (!row) return;
  toggleRow(row.dataset.keyId);
});
$("keys-body").addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || !state.expanded) return;
  const id = state.expanded;
  state.expanded = "";
  state.picker = "";
  renderTable();
  const again = $("keys-body").querySelector(`[data-toggle="${CSS.escape(id)}"]`);
  if (again) again.focus();
});
$("keySearch").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderTable();
});
$("save").onclick = saveAll;
$("discard").onclick = discardAll;
$("refresh").onclick = () => load({button:$("refresh"), busyText:"刷新中", doneText:"已刷新"});
$("reload-models").onclick = () => load({button:$("reload-models"), busyText:"获取中", doneText:"已更新", syncText:"获取模型中", doneSyncText:"模型已更新"});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && Date.now() - state.lastSync > 30000 && !state.expanded && !dirtyIds().length && !poolBusy()) load({silent:true});
});
window.addEventListener("beforeunload", e => {
  if (!dirtyIds().length) return;
  e.preventDefault();
  e.returnValue = "";
});
load();
schedulePoll();
</script>
</body>
</html>
