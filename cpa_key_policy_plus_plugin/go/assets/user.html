    body.kp-user {
      --kp-figures: "KP Receipt", var(--kp-font);
      --kp-bg: #e4e6e9;
      --kp-paper: #fbfbfa;
      --kp-surface: #fbfbfa;
      --kp-sunken: #f0f1f1;
      --kp-hover: #f0f1f2;
      --kp-text: #26282c;
      --kp-text-2: #4a4e55;
      --kp-text-3: #666a72;
      --kp-line: #e3e5e8;
      --kp-line-strong: #c4c7cc;
      --kp-rule: #bfc3c9;
      --kp-accent: #26282c;
      --kp-accent-ink: #fbfbfa;
      --kp-ok: #26282c;
      --kp-warn: #b8356a;
      --kp-over: #b42f28;
      --kp-pending: #2c54c2;
      --kp-selection: rgba(44, 84, 194, .16);
      --kp-fresh: rgba(38, 40, 44, .08);
      --kp-shadow: 0 1px 1px rgba(20, 22, 26, .05), 0 16px 36px -22px rgba(20, 22, 26, .42);
    }
    @media (prefers-color-scheme: dark) {
      body.kp-user {
        --kp-bg: #101113;
        --kp-paper: #1b1d20;
        --kp-surface: #1b1d20;
        --kp-sunken: #232529;
        --kp-hover: #24262a;
        --kp-text: #e9eae6;
        --kp-text-2: #c4c7cb;
        --kp-text-3: #9ea2a9;
        --kp-line: #2c2f33;
        --kp-line-strong: #43474d;
        --kp-rule: #3c4046;
        --kp-accent: #e9eae6;
        --kp-accent-ink: #1b1d20;
        --kp-ok: #e9eae6;
        --kp-warn: #f27daa;
        --kp-over: #ff7c72;
        --kp-pending: #8aa8ff;
        --kp-selection: rgba(138, 168, 255, .24);
        --kp-fresh: rgba(233, 234, 230, .07);
        --kp-shadow: 0 1px 1px rgba(0, 0, 0, .4), 0 18px 40px -24px rgba(0, 0, 0, .85);
      }
    }

    .counter { min-height: 100vh; padding: 32px 24px 56px; }
    .slip { background: var(--kp-paper); border-radius: 3px; box-shadow: var(--kp-shadow); }
    .rule { margin: 0; border: 0; border-top: 1px dashed var(--kp-rule); }
    .boot { margin: 22vh auto 0; text-align: center; color: var(--kp-text-2); }

    /* Login */
    .login-slip { width: min(440px, 100%); margin: 10vh auto 0; padding: 28px 28px 22px; }
    .login-slip h1 { font-size: var(--kp-fs-lg); font-weight: 700; }
    .login-form { margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--kp-rule); }
    .field-label { display: block; margin-bottom: 8px; font-size: var(--kp-fs-sm); font-weight: 600; }
    .login-row { display: flex; gap: 8px; }
    .login-row .input { font-family: var(--kp-figures); }
    .hint { margin-top: 10px; font-size: var(--kp-fs-xs); color: var(--kp-text-3); }
    .err { margin-top: 10px; min-height: 1.3em; font-size: var(--kp-fs-sm); font-weight: 600; color: var(--kp-over); }

    /* Desk: balance slip beside the roll */
    .desk {
      display: grid;
      grid-template-columns: minmax(300px, 372px) minmax(0, 780px);
      gap: 24px;
      justify-content: center;
      align-items: start;
      max-width: 1180px;
      margin: 0 auto;
    }
    .balance { position: sticky; top: 24px; padding: 22px 22px 20px; }
    .bal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .bal-head h1 { font-size: var(--kp-fs-md); font-weight: 700; line-height: 1.35; }
    .bal-actions { display: flex; gap: 4px; margin: -4px -8px 0 0; }
    .bal-actions .btn { border-color: transparent; background: transparent; color: var(--kp-text-2); }
    .bal-actions .btn:hover:not(:disabled) { border-color: var(--kp-line-strong); background: var(--kp-hover); color: var(--kp-text); }
    .i-refresh { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .is-syncing .i-refresh { animation: kp-spin .8s linear infinite; }
    .holder { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-top: 6px; }
    .holder-name { font-weight: 600; overflow-wrap: anywhere; }
    .holder-key { font-size: var(--kp-fs-xs); color: var(--kp-text-3); }
    .live { display: flex; align-items: center; gap: 7px; margin: 8px 0 14px; font-size: var(--kp-fs-xs); color: var(--kp-text-3); }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--kp-text-3); }
    .live[data-state="ok"] .live-dot { background: var(--kp-text); animation: kp-breathe 2.4s ease-in-out infinite; }
    .live[data-state="info"] .live-dot { background: transparent; border: 1.5px solid var(--kp-text); border-right-color: transparent; animation: kp-spin .8s linear infinite; }
    .live[data-state="warn"] .live-dot,
    .live[data-state="bad"] .live-dot { background: transparent; border: 1.5px solid var(--kp-text-2); }
    .live[data-state="bad"] { color: var(--kp-text-2); }

    .verdict { padding: 14px 0 16px; }
    .verdict-title { font-size: var(--kp-fs-xl); font-weight: 700; line-height: 1.3; text-wrap: balance; }
    .verdict-detail { margin-top: 4px; font-size: var(--kp-fs-sm); color: var(--kp-text-2); text-wrap: pretty; }
    .verdict.is-warn .verdict-title { color: var(--kp-warn); }
    .verdict.is-over .verdict-title { color: var(--kp-over); }
    .verdict.is-pending .verdict-title { color: var(--kp-pending); }

    .windows { border-top: 1px dashed var(--kp-rule); }
    .win { padding: 12px 0 13px; }
    .win + .win { border-top: 1px dashed var(--kp-rule); }
    .win-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }

    .trend { padding: 14px 0 12px; border-top: 1px dashed var(--kp-rule); }
    .trend-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .trend-head h2 { font-size: var(--kp-fs-sm); font-weight: 600; }
    .trend-peak { font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .trend-plot { position: relative; height: 76px; margin-top: 10px; border-bottom: 1px solid var(--kp-text); cursor: crosshair; touch-action: pan-y; }
    .trend-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .trend-plot rect { fill: var(--kp-text); transition: opacity .15s ease; }
    .trend-plot rect.is-zero { fill: var(--kp-rule); }

    .trend-plot:focus-visible { outline-offset: 4px; }
    .trend-axis { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--kp-text-3); }
    .trend-tip { display: block; min-height: 1.5em; margin-top: 6px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); }

    .tally { display: grid; gap: 5px; margin: 0; padding: 12px 0; border-top: 1px dashed var(--kp-rule); }
    .tally-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }

    .seg { display: inline-flex; overflow: hidden; border: 1px solid var(--kp-line-strong); border-radius: var(--kp-radius-sm); }

    .notice { margin: 12px 22px 0; padding: 8px 10px; border: 1px dashed var(--kp-text-3); border-radius: 3px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); }

    .line-chev { grid-area: chev; align-self: center; width: 14px; height: 14px; fill: none; stroke: var(--kp-text-3); stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; transition: transform .2s var(--kp-ease); }

    .team li { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--kp-text-2); }
    .team li.is-self { color: var(--kp-text); font-weight: 700; }
    .team li.is-over .team-fig { color: var(--kp-over); font-weight: 700; }
    .i-pin { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    /* Card: the same slip cut down to what matters at a glance */
    body.kp-card-mode .counter { min-height: 0; padding: 12px; }
    .card-slip { width: min(340px, 100%); margin: 0 auto; padding: 16px 16px 12px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .card-name { min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
    .card-live { display: flex; flex: none; align-items: center; gap: 6px; font-size: var(--kp-fs-xs); color: var(--kp-text-3); }
    .card-live .live-dot { width: 6px; height: 6px; }
    .card-live[data-state="ok"] .live-dot { background: var(--kp-text); }
    .card-main { margin-top: 10px; padding: 10px 0 12px; border-top: 1px dashed var(--kp-rule); }
    .card-label { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); }
    .card-label b { font-weight: 700; }
    .card-big { margin-top: 2px; font-size: 1.875rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
    .card-big small { margin-left: 6px; font-size: var(--kp-fs-sm); font-weight: 400; color: var(--kp-text-2); letter-spacing: 0; }
    .card-main.is-warn .card-big, .card-main.is-warn .card-label b { color: var(--kp-warn); }
    .card-main.is-over .card-big, .card-main.is-over .card-label b { color: var(--kp-over); }
    .card-main .meter { margin-top: 8px; height: 5px; border-radius: 1px; }
    .card-sub { margin-top: 6px; font-size: var(--kp-fs-xs); color: var(--kp-text-2); text-wrap: pretty; }
    .card-rows { display: grid; gap: 3px; padding: 9px 0; border-top: 1px dashed var(--kp-rule); font-size: var(--kp-fs-xs); }
    .card-rows div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; color: var(--kp-text-2); }
    .card-rows div b { color: var(--kp-text); font-weight: 600; }
    .card-rows div.is-over b { color: var(--kp-over); }
    .card-rows div.is-warn b { color: var(--kp-warn); }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 8px; border-top: 3px double var(--kp-text); font-size: var(--kp-fs-xs); color: var(--kp-text-3); }
    .card-foot .btn { min-height: 26px; padding: 0 9px; }
    body.is-pip { min-height: 0; background: var(--kp-paper); }
    body.is-pip .counter { padding: 0; }
    body.is-pip .card-slip { width: 100%; padding: 12px 14px 10px; border-radius: 0; box-shadow: none; }

    @keyframes kp-breathe { 50% { opacity: .3; } }
    @keyframes kp-print {
      0% { transform: translateY(-6px); background-color: var(--kp-fresh); }
      20% { transform: none; }
      100% { background-color: transparent; }
    }

    @media (max-width: 920px) {
      .desk { grid-template-columns: minmax(0, 640px); }
      .balance { position: static; }
    }
    @media (max-width: 560px) {
      .counter { padding: 12px 10px 40px; }
      .login-slip { margin-top: 6vh; padding: 22px 18px 18px; }
      .login-row { flex-direction: column; }
      .balance { padding: 18px 16px 16px; }
      .roll-head { padding: 0 14px 12px; }

      .line-main { grid-template-columns: 62px minmax(0, 1fr) auto; grid-template-areas: "time what cost" "sub sub sub"; column-gap: 10px; padding: 9px 12px; }
      .line-chev { display: none; }
      .line-detail { padding: 4px 12px 14px; }
      .calc-row { grid-template-columns: minmax(64px, 1fr) auto minmax(64px, auto); gap: 8px; font-size: var(--kp-fs-xs); }
      .roll-foot { padding: 12px 14px 14px; }
      .notice { margin: 12px 14px 0; }
    }
  </style>
</head>

<script>
const USER_API = location.pathname.startsWith("/key-policy-plus-user") ? "/key-policy-plus-user/api" : "/v0/resource/plugins/cpa-key-policy-plus/user/api";
const LOGGED_OUT_FLAG = "cpa_key_policy_plus_logged_out";
const EVENTS_LIMIT = 100;
const PAGE_SIZE = 40;
const CARD_MODE = new URLSearchParams(location.search).get("view") === "card";
const $ = (id) => document.getElementById(id);
const state = {
  me: null,
  usage: null,
  trend: null,
  trendUnavailable: false,
  trendIndex: -1,
  trendFetchedAt: 0,
  eventMap: new Map(),
  events: [],
  olderExhausted: false,
  loadingOlder: false,
  filter: "all",
  model: "",
  visible: PAGE_SIZE,
  expandedEvents: new Set(),
  seenEvents: new Set(),
  freshEvents: new Set(),
  errors: {usage:"", older:""},
  lastSync: 0,
  timer: null,
  refreshTimer: null,
  timeoutTimer: null,
  controller: null,
  seq: 0,
  refreshing: false,
  active: false,
  pool: null,
  pools: [],
  poolUnavailable: false,
  pip: null,
  live: {kind: "info", text: "正在同步"}
};

const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const numberFormat = new Intl.NumberFormat("zh-CN");
const num = (v) => numberFormat.format(Number(v || 0));
const signature = (value) => JSON.stringify(value ?? null);
const rangeLabel = (v) => ({ "5h":"5 小时", "24h":"24 小时", "7d":"7 天", "month":"本月" }[v] || v || "-");
const weekdays = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
function money(v, digits=2){
  if (v == null || v === "") return "未设";
  const n = Number(v);
  if (!Number.isFinite(n)) return "未设";
  if (digits === 2 && n > 0 && n < 0.005) return "<$0.01";
  return "$" + n.toFixed(digits);
}
function unitPrice(perMillion){
  const n = Number(perMillion);
  if (!Number.isFinite(n)) return "-";
  const fixed = n >= 1 ? n.toFixed(2) : n.toFixed(4).replace(/(\.\d\d\d*?)0+$/, "$1");
  return `$${fixed}/M`;
}
const pct = (v) => {
  if (v == null || !Number.isFinite(Number(v))) return "-";
  return `${(Number(v) * 100).toFixed(1)}%`;
};
const duration = (v) => {
  if (v == null || Number(v) <= 0) return "-";
  const n = Number(v);
  if (n < 1000) return `${Math.round(n)} ms`;
  return `${(n / 1000).toFixed(n < 10000 ? 2 : 1)} s`;
};
const pad = (n) => String(n).padStart(2, "0");
const clock = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const dayKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
function dayOffset(d){
  const start = new Date(); start.setHours(0, 0, 0, 0);
  const other = new Date(d); other.setHours(0, 0, 0, 0);
  return Math.round((other - start) / 86400000);
}
function dayLabel(d){
  const base = `${d.getMonth() + 1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
  const offset = dayOffset(d);
  if (offset === 0) return `今天 · ${base}`;
  if (offset === -1) return `昨天 · ${base}`;
  return base;
}
function whenLabel(unix){
  const d = new Date(Number(unix) * 1000);
  const offset = dayOffset(d);
  const day = offset === 0 ? "今天" : offset === 1 ? "明天" : `${d.getMonth() + 1}月${d.getDate()}日`;
  const minutes = Math.round((d.getTime() - Date.now()) / 60000);
  let rel = "";
  if (minutes > 0 && minutes < 60) rel = `（约 ${minutes} 分钟后）`;
  else if (minutes >= 60 && minutes < 48 * 60) rel = `（约 ${Math.round(minutes / 60)} 小时后）`;
  return `${day} ${hm(d)}${rel}`;
}
const beijingFormat = new Intl.DateTimeFormat("zh-CN", {timeZone:"Asia/Shanghai", month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false});
function resetLabel(unix){
  const parts = Object.fromEntries(beijingFormat.formatToParts(new Date(Number(unix) * 1000)).map(p => [p.type, p.value]));
  return `${parts.month}月${parts.day}日 ${parts.hour}:${parts.minute}`;
}
// Short Beijing-time form for same-day account windows, with a relative hint.
function shortResetLabel(unix){
  const at = new Date(Number(unix) * 1000);
  const p = Object.fromEntries(beijingFormat.formatToParts(at).map(x => [x.type, x.value]));
  const n = Object.fromEntries(beijingFormat.formatToParts(new Date()).map(x => [x.type, x.value]));
  const minutes = Math.round((at.getTime() - Date.now()) / 60000);
  const rel = minutes > 0 && minutes < 60 ? ` · 约 ${minutes} 分钟后` : minutes >= 60 && minutes < 48 * 60 ? ` · 约 ${Math.round(minutes / 60)} 小时后` : "";
  return `${p.month === n.month && p.day === n.day ? "" : `${p.month}月${p.day}日 `}${p.hour}:${p.minute} 恢复${rel}`;
}
function reasonText(reason){
  return ({
    model_price_unavailable: "模型价格缺失",
    cpamp_price_unavailable: "CPAMP 价格不可用",
    billing_price_unavailable: "计费价格不可用",
    model_or_service_tier_price_unavailable: "模型或服务等级价格缺失"
  })[reason] || reason || "价格规则待核验";
}

function setLive(kind, text){
  const el = $("live");
  el.dataset.state = kind;
  el.querySelector(".live-text").textContent = text;
  state.live = {kind, text};
  renderCard();
}
function setRefreshState(kind, text){
  const refresh = $("refresh");
  refresh.classList.toggle("is-syncing", kind === "syncing");
  refresh.disabled = kind === "syncing";
  refresh.setAttribute("aria-busy", kind === "syncing" ? "true" : "false");
  refresh.querySelector(".sync-label").textContent = text || "刷新";
  clearTimeout(state.refreshTimer);
  if (kind === "updated" || kind === "error") {
    state.refreshTimer = setTimeout(() => { refresh.querySelector(".sync-label").textContent = "刷新"; }, 1400);
  }
}
function syncedText(){
  return state.lastSync ? `${clock(new Date(state.lastSync))} 更新` : "";
}
function markRefreshStart(force){
  if (force) {
    setRefreshState("syncing", "同步中");
    setLive("info", "正在同步");
  }
}
function refreshMinimumDelay(force, startedAt){
  if (!force) return Promise.resolve();
  const waitMs = Math.max(0, 420 - (performance.now() - startedAt));
  return new Promise(resolve => setTimeout(resolve, waitMs));
}
function markRefreshDone(force){
  state.lastSync = Date.now();
  if (force) setRefreshState("updated", "已更新");
  setLive("ok", `实时 · ${syncedText()}`);
}
function markRefreshError(force){
  if (force) setRefreshState("error", "同步失败");
  setLive("bad", state.lastSync ? `连接异常 · 显示 ${clock(new Date(state.lastSync))} 的数据` : "连接异常");
}

function enteredKey(){
  return $("key").value.trim().replace(/^authorization\s*:\s*/i,"").replace(/^(bearer\s+)+/i,"").trim();
}
function localKeyHint(v){
  if (!v) return "请粘贴完整的 CPA 原生 sk- Key。";
  if (/^cpa_/i.test(v)) return "cpa_ Key 已停用，请用 sk- Key。";
  if (v.includes("...") || v.includes("…")) return "这是 Key 预览，请粘贴完整 Key。";
  if (!/^sk[-_]/i.test(v)) return "只支持 sk- 开头的 Key。";
  return "";
}
async function api(path, opts={}){
  const r = await fetch(USER_API + path, {cache:"no-store", credentials:"same-origin", ...opts});
  let d = {};
  try { d = await r.json(); } catch (_) {}
  if (!d.ok) throw Object.assign(new Error(d.message || d.error || `HTTP ${r.status}`), {data:d, status:r.status});
  return d;
}
function errorMessage(e, fallback){
  const data = (e && e.data) || {};
  return data.message || data.error || (e && e.message) || fallback || "同步失败";
}
function isAuthError(e){
  const data = (e && e.data) || {};
  return e && (e.status === 401 || e.status === 403 || data.category === "auth" || data.error === "not_authenticated");
}
function isMissingRoute(e){
  return e && [403, 404, 405].includes(e.status) && !(e.data && e.data.category === "auth");
}
function isRefreshCancel(signal){
  return signal && signal.aborted && signal.reason === "refresh_cancelled";
}
function clearRefreshTimeout(){
  if (state.timeoutTimer) clearTimeout(state.timeoutTimer);
  state.timeoutTimer = null;
}
function cancelRefresh(){
  if (state.controller) state.controller.abort("refresh_cancelled");
  state.controller = null;
  clearRefreshTimeout();
  clearTimeout(state.refreshTimer);
  state.refreshTimer = null;
  state.refreshing = false;
  state.seq += 1;
  const refresh = $("refresh");
  refresh.classList.remove("is-syncing");
  refresh.disabled = false;
  refresh.setAttribute("aria-busy", "false");
  refresh.querySelector(".sync-label").textContent = "刷新";
}

/* Quota windows */
function limitForRange(limits, range){
  if (!limits) return null;
  if (range === "5h") return limits.five_hour_usd;
  if (range === "24h") return limits.daily_usd;
  if (range === "7d") return limits.weekly_usd;
  if (range === "month") return limits.monthly_usd;
  return null;
}
const quotaWindows = [
  {range:"5h", title:"5 小时额度", desc:"最近 5 小时 · 滚动"},
  {range:"24h", title:"24 小时额度", desc:"最近 24 小时 · 滚动"},
  {range:"7d", title:"7 天额度", desc:"最近 7 天 · 滚动"},
  {range:"month", title:"本月额度", desc:"自然月"}
];
function primaryRange(){
  return state.me && state.me.quota_mode === "weekly_only" ? "7d" : "24h";
}
function visibleQuotaWindows(){
  return state.me && state.me.quota_mode === "weekly_only"
    ? quotaWindows.filter(item => item.range === "7d")
    : quotaWindows;
}
function quotaState(used, limit){
  if (limit == null || limit === "") return {text:"未设置上限", cls:"unset", percent:0};
  const max = Number(limit || 0);
  if (max <= 0) return {text:"已超限", cls:"over", percent:100};
  const percent = Math.min(Math.max(Number(used || 0) / max, 0), 1) * 100;
  if (Number(used || 0) >= max) return {text:"已超限", cls:"over", percent:100};
  if (percent >= 80) return {text:"接近上限", cls:"warn", percent};
  return {text:"正常", cls:"ok", percent};
}
function windowRows(){
  const me = state.me || {};
  const windows = me.usage || {};
  const limits = me.limits || {};
  const quota = me.quota || {};
  // In a carpool the share meters the pool's models; a USD limit still
  // covers every other model and counts only that usage ("池外").
  const pooled = Boolean((me.pool || {}).usd_windows_off);
  return visibleQuotaWindows().map(item => {
    const q = quota[item.range] || {};
    const limit = limitForRange(limits, item.range);
    const hasLimit = !(limit == null || limit === "");
    if (pooled && !hasLimit) return {item, used: Number(windows[item.range] || 0), limit: null, st: {text:"按份额", cls:"unset", percent:0}, q};
    const used = pooled ? Number(q.used_usd || 0) : Number(windows[item.range] || 0);
    return {item: pooled ? {...item, title: `池外 · ${item.title}`} : item, used, limit, st: quotaState(used, limit), q};
  });
}
function ppText(v, digits=2){
  const n = Number(v);
  return Number.isFinite(n) ? `${n.toFixed(digits)}%` : "-";
}
function signedPP(v){
  const n = Number(v || 0);
  return `${n > 0 ? "+" : n < 0 ? "−" : ""}${Math.abs(n).toFixed(2)}`;
}
/* Carpool share */
function poolShare(pool = state.pool){
  if (!pool || !pool.me) return null;
  const me = pool.me;
  return {
    pool, me,
    burst: me.burst && me.burst.active ? me.burst : null,
    owner: me.role === "owner",
    pinned: me.role === "pinned",
    reset: Number((pool.account || {}).reset_at || 0),
    borrow: pool.borrow && pool.borrow.active ? pool.borrow : null
  };
}
// How far a bursting member is past their share, in points; 0 within it.
function burstOverPP(share){
  if (!share || !share.burst) return 0;
  const over = Number(share.me.used_pp || 0) - Number(share.me.available_pp || 0);
  return over >= 0.005 ? over : 0;
}
// A borrow lasts until the member's own account takes requests again.
function borrowEnd(b){ return Number(b.until || 0); }
function borrowText(share){
  const b = share.borrow;
  const end = borrowEnd(b);
  return `本车暂时用不了，已改用「${b.lender}」${end ? `，${resetLabel(end)}前` : ""}。`;
}
function joinSentences(first, second){
  if (!first) return second;
  return /[。！？.!?]$/.test(first) ? first + second : first + "。" + second;
}
function verdict(){
  const base = quotaVerdict();
  const share = poolShare();
  // Billing holds, disabled keys and used-up USD windows already block.
  if (!share || base.cls === "pending" || base.cls === "over") return base;
  if (share.borrow) return {cls:"ok", title:"借用中", detail: borrowText(share)};
  if (share.owner || share.pinned) return base;
  const {pool, me, burst, reset} = share;
  if (burst) {
    return {...base, detail: joinSentences(base.detail, `爽蹬中，${resetLabel(burst.cycle_reset_at)}前不限份额${burst.mode === "carry" ? "，超出部分下周期扣回" : ""}。`)};
  }
  if (me.state === "over") {
    return {cls:"over", title:"份额已用完", detail: reset ? `${resetLabel(reset)}恢复。` : "账号重置后恢复。"};
  }
  if (base.cls === "warn") return base;
  if (me.state === "near") {
    return {cls:"warn", title:"份额快用完", detail:`份额只剩 ${ppText(Math.max(me.remaining_pp, 0))}` + (me.remaining_usd != null ? `（约 ${money(me.remaining_usd)}）` : "") + "。"};
  }
  return {...base, detail: joinSentences(base.detail, `份额还剩 ${ppText(Math.max(me.remaining_pp, 0))}。`)};
}
function quotaVerdict(){
  const me = state.me || {};
  const hold = me.billing_hold || {};
  if (hold.active) {
    return {cls:"pending", title:"已暂停：费用待核算", detail:`${hold.model || "未知模型"} ${reasonText(hold.reason)}，管理员结算后恢复。`};
  }
  if (me.enabled === false) return {cls:"over", title:"这把 Key 已停用", detail:"请联系管理员。"};
  const rows = windowRows();
  const over = rows.filter(row => row.st.cls === "over");
  if (over.length) {
    const times = over.map(row => Number(row.item.range === "month" ? row.q.resets_at : row.q.recovers_at) || 0);
    const when = times.every(t => t > 0) ? Math.max(...times) : 0;
    return {
      cls:"over",
      title:"已被拦截",
      detail:`${over.map(row => row.item.title).join("、")}已用完` + (when ? `，预计${whenLabel(when)}恢复。` : "。")
    };
  }
  const byRoom = (a, b) => (a.limit - a.used) - (b.limit - b.used);
  const near = rows.filter(row => row.st.cls === "warn").sort(byRoom);
  if (near.length) {
    return {cls:"warn", title:"即将用完", detail:`${near[0].item.title}只剩 ${money(Math.max(near[0].limit - near[0].used, 0))}。`};
  }
  if ((me.pool || {}).usd_windows_off) {
    return {cls:"ok", title:"现在可以使用", detail:""};
  }
  const limited = rows.filter(row => row.st.cls === "ok").sort(byRoom);
  if (limited.length) {
    return {cls:"ok", title:"现在可以使用", detail:`${limited[0].item.title}还剩 ${money(limited[0].limit - limited[0].used)}。`};
  }
  return {cls:"ok", title:"现在可以使用", detail:"未设置费用上限。"};
}
function renderQuotaWindowCard(row){
  const {item, used, limit, st, q} = row;
  const hasLimit = !(limit == null || limit === "");
  const remaining = hasLimit ? Math.max(Number(limit || 0) - used, 0) : null;
  let foot = item.desc;
  if (item.range === "month" && q.resets_at) foot = `${resetLabel(q.resets_at)}重置`;
  if (st.cls === "over" && q.recovers_at) foot = `${item.desc} · 预计${whenLabel(q.recovers_at)}恢复`;
  const meterCls = st.cls === "warn" ? " is-warn" : st.cls === "over" ? " is-over" : "";
  return `<article class="win win-${st.cls}">
    <div class="win-top"><h3 class="win-title">${esc(item.title)}</h3><b class="win-state">${esc(st.text)}</b></div>
    <div class="win-figs num">${hasLimit
      ? `<span class="win-used">${money(used)}</span><span class="win-of">/ ${money(limit)}</span><span class="win-left">剩 ${money(remaining)}</span>`
      : `<span class="win-used">${money(used)}</span>`}</div>
    ${hasLimit ? `<div class="meter${meterCls}" role="img" aria-label="${esc(item.title)}已用 ${Math.round(st.percent)}%"><span style="--p:${st.percent.toFixed(1)}%"></span></div>` : ""}
    <div class="win-foot">${esc(foot)}</div>
  </article>`;
}
function renderBalance(){
  const me = state.me;
  if (!me) return;
  $("keyName").textContent = me.name || me.alias || "-";
  $("keyPreview").textContent = String(me.preview || "").replace(/\.\.\./g, "…");
  const v = verdict();
  $("verdict").className = `verdict is-${v.cls}`;
  $("verdict").innerHTML = `<div class="verdict-title">${esc(v.title)}</div>${v.detail ? `<div class="verdict-detail">${esc(v.detail)}</div>` : ""}`;
  $("quotaCards").innerHTML = windowRows().map(renderQuotaWindowCard).join("");
  renderPool();
  renderTally();
  renderCard();
  fitBalance();
}
function renderPool(){
  const el = $("pool");
  const main = poolSection(poolShare(), "poolTitle");
  if (!main) { el.className = "pool hidden"; el.innerHTML = ""; }
  else { el.className = main.cls; el.innerHTML = main.html; }
  // Other pools the key rides (a Grok pool next to the Codex one).
  $("poolMore").innerHTML = state.pools.slice(1).map((pool, i) => {
    const more = poolSection(poolShare(pool), `poolTitle${i + 2}`);
    return more ? `<section class="${more.cls}" aria-labelledby="poolTitle${i + 2}">${more.html}</section>` : "";
  }).join("");
}
function poolSection(share, titleId){
  if (!share) return null;
  const {pool, me, burst, owner, pinned} = share;
  const acct = pool.account || {};
  let cls = "ok", stateText = "正常";
  if (share.borrow) stateText = "借用中";
  else if (owner) stateText = "车主不限";
  else if (pinned) stateText = "固定路由";
  else if (burst) stateText = "爽蹬中";
  else if (me.state === "over") { cls = "over"; stateText = "已用完"; }
  else if (me.state === "near") { cls = "warn"; stateText = "快用完"; }
  const used = Number(me.used_pp || 0);
  const avail = Number(me.available_pp || 0);
  const remaining = Number(me.remaining_pp || 0);
  const percent = avail > 0 ? Math.min(Math.max(used / avail, 0), 1) * 100 : (used > 0 ? 100 : 0);
  let figs, meter = "";
  const foot = [];
  if (owner || pinned) {
    figs = `<span class="win-used">${ppText(used)}</span><span class="win-left">本周期已用</span>`;
  } else {
    const over = burstOverPP(share);
    figs = `<span class="win-used">${ppText(used)}</span><span class="win-of">/ ${ppText(avail)}</span><span class="win-left">${over ? `超出 ${ppText(over)}` : `剩 ${ppText(Math.max(remaining, 0))}`}</span>`;
    meter = `<div class="meter${cls === "warn" ? " is-warn" : cls === "over" ? " is-over" : ""}" role="img" aria-label="拼车份额已用 ${Math.round(percent)}%"><span style="--p:${percent.toFixed(1)}%"></span></div>`;
    if (me.remaining_usd != null && remaining > 0) foot.push(`约剩 ${money(me.remaining_usd)}`);
    if (me.carry_pp) foot.push(`含上期结转 ${signedPP(me.carry_pp)}`);
  }
  const facts = [];
  if (acct.full) facts.push(["这个号", acct.full_until ? `已满 · ${resetLabel(acct.full_until)}恢复` : "现在用不了"]);
  const whole = pool.budgeted ? "预算本周" : "账号本周";
  if (pool.account_hidden) {
    if (acct.reset_at) facts.push(["份额重置", resetLabel(acct.reset_at)]);
  } else if (pool.in_cycle && acct.used_percent != null) facts.push([whole, `${Math.round(acct.used_percent)}%${acct.reset_at ? ` · ${resetLabel(acct.reset_at)}重置` : ""}`]);
  else if (acct.status === "reset_pending") facts.push(["账号本周", "已重置"]);
  if (acct.short) {
    const reset = Number(acct.short.reset_at || 0);
    facts.push(["5 小时窗口", reset && reset * 1000 <= Date.now() ? "已重置" : `${Math.round(acct.short.used_percent)}%${reset ? ` · ${shortResetLabel(reset)}` : ""}`]);
  }
  const team = (pool.account_hidden ? [] : pool.team || []).map(row => {
    const over = !(row.burst && row.burst.active) && row.state === "over";
    const fig = row.role === "owner" || row.available_pp == null ? ppText(row.used_pp) : `${ppText(row.used_pp)} / ${ppText(row.available_pp, row.available_pp % 1 ? 2 : 0)}`;
    return `<li class="${row.self ? "is-self" : ""}${over ? " is-over" : ""}"><span>${esc(row.label)}${!row.self && row.burst && row.burst.active ? " · 爽蹬中" : ""}</span><span class="team-fig num">${fig}</span></li>`;
  });
  const unnamed = [["其他人", pool.others_pp], ["借给其他车", pool.lent_pp], ["追踪前 / CPA 外", pool.untracked_pp]];
  for (const [label, value] of unnamed) {
    if (Number(value || 0) >= 0.005) team.push(`<li><span>${label}</span><span class="team-fig num">${ppText(value)}</span></li>`);
  }
  return {cls: `pool win-${cls}`, html: `<div class="pool-top"><h2 id="${titleId}" class="pool-title">拼车 · ${esc(pool.name)}</h2><b class="win-state">${esc(stateText)}</b></div>
    <div class="win-figs num">${figs}</div>${meter}
    ${foot.length ? `<div class="win-foot num">${esc(foot.join(" · "))}</div>` : ""}
    <dl class="pool-facts">${facts.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd class="num">${esc(v)}</dd></div>`).join("")}</dl>
    ${team.length ? `<ol class="team" aria-label="本周期各人用量">${team.join("")}</ol>` : ""}
`};
}

/* Card and pin-to-desktop */
function cardMainHTML(){
  const share = poolShare();
  const v = verdict();
  if (v.cls === "over" || v.cls === "pending") {
    // Whatever blocks the key leads the card, even when the share has room.
    const extra = share && !share.owner && v.title !== "份额已用完" ? `拼车份额剩 ${ppText(Math.max(Number(share.me.remaining_pp || 0), 0))}` : "";
    return `<div class="card-main is-${v.cls === "pending" ? "warn" : "over"}">
      <div class="card-label"><span>${esc(share ? `拼车 · ${share.pool.name}` : "当前状态")}</span><b>${v.cls === "pending" ? "已暂停" : "拦截中"}</b></div>
      <div class="card-big">${esc(v.title)}</div>
      <div class="card-sub">${esc(v.detail)}</div>
      ${extra ? `<div class="card-sub num">${esc(extra)}</div>` : ""}
    </div>`;
  }
  if (share && share.pinned && !share.borrow) return windowCardHTML();
  if (share && share.borrow) {
    const b = share.borrow;
    const end = borrowEnd(b);
    const sub = ["本车现在用不了"];
    if (end) sub.push(`${resetLabel(end)}前`);
    return `<div class="card-main is-ok">
      <div class="card-label"><span>拼车 · ${esc(share.pool.name)}</span><b>借用中</b></div>
      <div class="card-big">借用「${esc(b.lender)}」</div>
      <div class="card-sub">${esc(sub.join(" · "))}</div>
      ${Number(b.used_pp || 0) >= 0.005 ? `<div class="card-sub num">${esc(`已借用 ${ppText(b.used_pp)} · ${money(b.cost_usd)}`)}</div>` : ""}
    </div>`;
  }
  if (share && !share.owner) {
    const {pool, me, burst} = share;
    const acct = pool.account || {};
    const cls = burst ? "ok" : me.state === "over" ? "over" : me.state === "near" ? "warn" : "ok";
    const rem = Math.max(Number(me.remaining_pp || 0), 0);
    const used = Number(me.used_pp || 0), avail = Number(me.available_pp || 0);
    const percent = avail > 0 ? Math.min(Math.max(used / avail, 0), 1) * 100 : 100;
    const over = burstOverPP(share);
    const sub = [`已用 ${ppText(used)} / ${ppText(avail)}`];
    if (pool.in_cycle && acct.used_percent != null) sub.push(`账号本周 ${Math.round(acct.used_percent)}%`);
    if (acct.reset_at) sub.push(`${resetLabel(acct.reset_at)}重置`);
    return `<div class="card-main is-${cls}">
      <div class="card-label"><span>拼车 · ${esc(pool.name)}</span><b>${burst ? "爽蹬中" : cls === "over" ? "已用完" : cls === "warn" ? "快用完" : "正常"}</b></div>
      <div class="card-big num">${over ? `超出 ${ppText(over)}` : cls === "over" ? "份额已用完" : `剩 ${ppText(rem)}`}${me.remaining_usd != null && rem > 0 ? `<small>≈ ${money(me.remaining_usd)}</small>` : ""}</div>
      <div class="meter${cls === "warn" ? " is-warn" : cls === "over" ? " is-over" : ""}"><span style="--p:${percent.toFixed(1)}%"></span></div>
      <div class="card-sub num">${esc(sub.join(" · "))}</div>
      ${over && burst.mode === "carry" ? `<div class="card-sub num">${esc(`下周期最多扣回 ${ppText(over)}`)}</div>` : ""}
    </div>`;
  }
  if (share && share.owner) {
    const acct = share.pool.account || {};
    return `<div class="card-main">
      <div class="card-label"><span>拼车 · ${esc(share.pool.name)}</span><b>车主</b></div>
      <div class="card-big num">${share.pool.in_cycle && acct.used_percent != null ? `账号 ${Math.round(acct.used_percent)}%` : "账号 —"}</div>
      <div class="card-sub num">${esc(`你本周期已用 ${ppText(share.me.used_pp)}` + (acct.reset_at ? ` · ${resetLabel(acct.reset_at)}重置` : ""))}</div>
    </div>`;
  }
  return windowCardHTML();
}
// The card for a key held to its USD windows.
function windowCardHTML(){
  const rows = windowRows();
  const row = rows.find(r => r.item.range === primaryRange()) || rows[0];
  if (!row) return `<div class="card-main"><div class="card-big">—</div></div>`;
  const has = !(row.limit == null || row.limit === "");
  const cls = row.st.cls === "over" ? "over" : row.st.cls === "warn" ? "warn" : "ok";
  return `<div class="card-main is-${cls}">
    <div class="card-label"><span>${esc(row.item.title)}</span><b>${esc(row.st.text)}</b></div>
    <div class="card-big num">${has ? `剩 ${money(Math.max(Number(row.limit) - row.used, 0))}` : money(row.used)}${has ? "" : "<small>不限额</small>"}</div>
    ${has ? `<div class="meter${cls === "ok" ? "" : " is-" + cls}"><span style="--p:${row.st.percent.toFixed(1)}%"></span></div>` : ""}
    <div class="card-sub num">${esc(has ? `已用 ${money(row.used)} / ${money(row.limit)}` : row.item.desc)}</div>
  </div>`;
}
function cardHTML(){
  const me = state.me || {};
  const share = poolShare();
  const primary = share && !share.owner && !share.pinned ? "" : primaryRange();
  const rows = windowRows().filter(r => !(r.limit == null || r.limit === "") && r.item.range !== primary);
  const lines = rows.map(r => `<div class="${r.st.cls === "over" ? "is-over" : r.st.cls === "warn" ? "is-warn" : ""}"><span>${esc(r.item.title)}</span><b class="num">${money(r.used)} / ${money(r.limit)}</b></div>`);
  for (const pool of state.pools.slice(1)) {
    const extra = poolShare(pool);
    if (!extra || extra.owner || extra.pinned) continue;
    const over = !extra.burst && extra.me.state === "over";
    const text = extra.burst ? "爽蹬中" : over ? "份额已用完" : `剩 ${ppText(Math.max(Number(extra.me.remaining_pp || 0), 0))}`;
    lines.push(`<div class="${over ? "is-over" : extra.me.state === "near" ? "is-warn" : ""}"><span>拼车 · ${esc(pool.name)}</span><b class="num">${esc(text)}</b></div>`);
  }
  const live = state.live || {};
  return `<div class="card-head"><div class="card-name">${esc(me.name || me.alias || "CPA 用量")}</div><div class="card-live live" data-state="${esc(live.kind)}"><span class="live-dot" aria-hidden="true"></span>${esc(live.kind === "ok" ? "实时" : live.kind === "bad" ? "连接异常" : "同步中")}</div></div>
    ${cardMainHTML()}
    ${lines.length ? `<div class="card-rows">${lines.join("")}</div>` : ""}
    <div class="card-foot"><span class="num">${esc(syncedText() || "正在同步")}</span><button class="btn small" type="button" data-card-refresh>刷新</button></div>`;
}
function renderCard(){
  if (!state.me) return;
  if (CARD_MODE && state.active) $("card").innerHTML = cardHTML();
  if (state.pip) {
    const root = state.pip.document.getElementById("cardRoot");
    if (root) root.innerHTML = cardHTML();
  }
}
async function pinCard(){
  if (state.pip) { state.pip.focus(); return; }
  if ("documentPictureInPicture" in window) {
    try {
      const pip = await window.documentPictureInPicture.requestWindow({width: 300, height: 320});
      document.querySelectorAll("style").forEach(node => pip.document.head.appendChild(node.cloneNode(true)));
      const meta = pip.document.createElement("meta");
      meta.name = "color-scheme";
      meta.content = "light dark";
      pip.document.head.appendChild(meta);
      pip.document.title = "用量小票";
      pip.document.body.className = "kp-user kp-card-mode is-pip";
      pip.document.body.innerHTML = `<main class="counter"><section id="cardRoot" class="slip card-slip" aria-label="用量小票"></section></main>`;
      pip.document.body.addEventListener("click", (e) => { if (e.target.closest("[data-card-refresh]")) refreshActive(true); });
      pip.addEventListener("pagehide", () => { state.pip = null; });
      state.pip = pip;
      renderCard();
      return;
    } catch (_) {}
  }
  window.open(location.pathname + "?view=card", "kp-card", "popup=yes,width=340,height=420");
}
function renderTally(){
  const summary = (state.usage || {}).summary;
  if (!summary) { $("tally").innerHTML = ""; $("total").innerHTML = ""; return; }
  const usage = summary.usage || {};
  const calls = Number(summary.calls || 0);
  const failed = Number(summary.failed || 0);
  const billingPendingCount = Number(summary.billing_pending || 0);
  const settledCalls = Math.max(calls - billingPendingCount, 0);
  const successRate = settledCalls ? (settledCalls - failed) / settledCalls : null;
  const cacheTotal = Number(usage.cached_tokens || 0) + Number(usage.cache_read_tokens || 0) + Number(usage.cache_creation_tokens || 0);
  const range = primaryRange();
  $("tally").innerHTML = `
    <div class="tally-row"><dt>调用</dt><dd class="num">${num(calls)} 次</dd></div>
    <div class="tally-sub num">成功率 ${pct(successRate)} · 失败 ${num(failed)}${billingPendingCount ? ` · 待核算 ${num(billingPendingCount)}` : ""}</div>
    <div class="tally-row"><dt>Token</dt><dd class="num">${num(usage.total_tokens)}</dd></div>
    <div class="tally-sub num">输入 ${num(usage.input_tokens)} · 输出 ${num(usage.output_tokens)}</div>
    <div class="tally-row"><dt>思考量</dt><dd class="num">${num(usage.reasoning_tokens)}</dd></div>
    <div class="tally-row"><dt>缓存活动</dt><dd class="num">${num(cacheTotal)}</dd></div>`;
  $("total").innerHTML = `<span>${esc(rangeLabel(range))}合计</span><b class="num">${money(summary.total_cost)}</b>`;
}
function fitBalance(){
  const el = $("balance");
  if (!el || getComputedStyle(el).position !== "sticky") return;
  el.style.top = `${Math.min(24, window.innerHeight - el.offsetHeight - 24)}px`;
}

/* Trend */
function bucketLabel(bucket, daily, last){
  const start = new Date(Number(bucket.start) * 1000);
  if (daily) return dayOffset(start) === 0 ? "今天" : `${start.getMonth() + 1}月${start.getDate()}日 ${weekdays[start.getDay()]}`;
  const end = new Date(Number(bucket.end) * 1000);
  return `${hm(start)}–${last ? "现在" : hm(end)}`;
}
function trendTip(index){
  const t = state.trend;
  if (!t || !t.buckets || !t.buckets[index]) return "";
  const daily = Number(t.bucket_seconds) >= 86400;
  const b = t.buckets[index];
  const parts = [bucketLabel(b, daily, index === t.buckets.length - 1), money(b.cost), `${num(b.calls)} 次`];
  if (b.failed) parts.push(`失败 ${num(b.failed)}`);
  if (b.billing_pending) parts.push(`待核算 ${num(b.billing_pending)}`);
  return parts.join(" · ");
}
function renderTrend(){
  const figure = $("trend");
  const t = state.trend;
  if (state.trendUnavailable || !t || !Array.isArray(t.buckets) || !t.buckets.length) {
    figure.classList.add("hidden");
    fitBalance();
    return;
  }
  figure.classList.remove("hidden");
  const buckets = t.buckets;
  const daily = Number(t.bucket_seconds) >= 86400;
  const n = buckets.length;
  const max = Math.max(...buckets.map(b => Number(b.cost || 0)), 0);
  const peak = buckets.reduce((best, b, i) => Number(b.cost || 0) > Number(buckets[best].cost || 0) ? i : best, 0);
  if (state.trendIndex < 0 || state.trendIndex >= n) state.trendIndex = n - 1;
  $("trendTitle").textContent = daily ? `近 ${rangeLabel(t.range)}每天消费` : `近 ${rangeLabel(t.range)}每小时消费`;
  $("trendPeak").textContent = max > 0 ? `峰值 ${money(max)}` : "暂无消费";
  const slot = 10;
  const bars = buckets.map((b, i) => {
    const cost = Number(b.cost || 0);
    const h = max > 0 ? Math.max(cost / max * 60, cost > 0 ? 1.5 : 0) : 0;
    const zero = h === 0;
    return `<rect class="${zero ? "is-zero" : ""}${i === state.trendIndex ? " is-active" : ""}" x="${i * slot + 1.5}" y="${zero ? 59.2 : 60 - h}" width="${slot - 3}" height="${zero ? 0.8 : h}"></rect>`;
  }).join("");
  $("trendPlot").innerHTML = `<svg viewBox="0 0 ${n * slot} 60" preserveAspectRatio="none" shape-rendering="crispEdges" aria-hidden="true">${bars}</svg>`;
  $("trendPlot").setAttribute("aria-label", `共 ${money(t.total_cost)}，峰值 ${money(max)}（${bucketLabel(buckets[peak], daily, peak === n - 1)}）。用左右方向键逐个查看。`);
  const ticks = [0, Math.round((n - 1) / 3), Math.round((n - 1) * 2 / 3), n - 1];
  $("trendAxis").innerHTML = ticks.map((i, k) => {
    const start = new Date(Number(buckets[i].start) * 1000);
    const label = k === ticks.length - 1 ? (daily ? "今天" : "现在") : daily ? weekdays[start.getDay()] : `${pad(start.getHours())}:00`;
    return `<span>${esc(label)}</span>`;
  }).join("");
  $("trendTip").textContent = trendTip(state.trendIndex);
  fitBalance();
}
function setTrendIndex(index, scrubbing){
  const t = state.trend;
  if (!t || !t.buckets || !t.buckets.length) return;
  const next = Math.max(0, Math.min(t.buckets.length - 1, index));
  state.trendIndex = next;
  $("trendPlot").classList.toggle("is-scrubbing", Boolean(scrubbing));
  $("trendPlot").querySelectorAll("rect").forEach((rect, i) => rect.classList.toggle("is-active", i === next));
  $("trendTip").textContent = trendTip(next);
}

/* Roll */
function eventID(e){
  return e.request_id || `${e.requested_at || ""}|${e.model || ""}|${e.latency_ms || 0}|${e.cost || 0}`;
}
function billingPending(ev){
  return Boolean((ev && ev.billing_pending) || (ev && ev.cost_breakdown && ev.cost_breakdown.billing_pending));
}
function billingPendingReason(ev){
  const breakdown = (ev && ev.cost_breakdown) || {};
  return (ev && ev.billing_pending_reason) || breakdown.billing_pending_reason || "价格规则待核验";
}
function modelOf(ev){
  return ev.model || ev.actual_model || ev.requested_model || "-";
}
function eventSig(e){
  return signature([e.requested_at, e.failed, e.model, e.actual_model, e.latency_ms, e.ttft_ms, e.cost, e.usage, e.failure,
    e.reasoning_effort, e.service_tier, e.status_code, e.billing_pending, e.billing_pending_reason]);
}
function sourceLabel(source){
  return ({
    cpamp_price_book: "CPAMP 模型价格",
    cpamp_cached_price_book: "CPAMP 缓存价格",
    key_policy_plus_price_book: "Plus 价格表",
    cpamp_billing_pending: "待核算",
    cpamp_price_unavailable: "价格不可用"
  })[source] || source || "-";
}
function calcRow(label, tokens, cost, pending){
  const t = Number(tokens || 0);
  const c = Number(cost || 0);
  const unit = t > 0 && !pending ? ` × ${unitPrice(c * 1e6 / t)}` : "";
  return `<div class="calc-row"><span class="calc-label">${esc(label)}</span><span class="calc-qty num">${num(t)}${unit}</span><span class="calc-amt num">${pending ? "待核算" : money(c, 4)}</span></div>`;
}
function eventDetail(ev){
  const usage = ev.usage || {};
  const breakdown = ev.cost_breakdown || {};
  const tokens = breakdown.tokens || {};
  const costs = breakdown.costs || {};
  const pending = billingPending(ev);
  const rows = [];
  const uncached = tokens.billable_uncached_input ?? Math.max(Number(usage.input_tokens || 0) - Number(usage.cached_tokens || 0) - Number(usage.cache_read_tokens || 0) - Number(usage.cache_creation_tokens || 0), 0);
  rows.push(calcRow("输入（未缓存）", uncached, costs.input, pending));
  const cachedIn = tokens.cached_input ?? usage.cached_tokens;
  if (Number(cachedIn || 0) > 0 || Number(costs.cached_input || 0) > 0) rows.push(calcRow("缓存命中", cachedIn, costs.cached_input, pending));
  const cacheRead = tokens.cache_read ?? usage.cache_read_tokens;
  if (Number(cacheRead || 0) > 0 || Number(costs.cache_read || 0) > 0) rows.push(calcRow("缓存读取", cacheRead, costs.cache_read, pending));
  const cacheWrite = tokens.cache_creation ?? usage.cache_creation_tokens;
  if (Number(cacheWrite || 0) > 0 || Number(costs.cache_creation || 0) > 0) rows.push(calcRow("缓存写入", cacheWrite, costs.cache_creation, pending));
  rows.push(calcRow("输出", tokens.output ?? usage.output_tokens, costs.output, pending));
  const reasoning = Number(tokens.reasoning ?? usage.reasoning_tokens ?? 0);
  const visible = Number(tokens.visible_output_estimate ?? Math.max(Number(usage.output_tokens || 0) - reasoning, 0));
  const requested = ev.requested_model || ev.model || "-";
  const actual = ev.actual_model || ev.model || "-";
  const quotaLabel = state.me && state.me.quota_mode === "weekly_only" ? "滚动 7 天" : "5 小时 / 24 小时 / 7 天 / 本月";
  const facts = [
    ["请求 ID", ev.request_id || "-"],
    ["接口", ev.endpoint || "-"],
    ["模型", requested === actual ? requested : `${requested} → ${actual}`],
    ["通道", [ev.provider, ev.executor_type].filter(Boolean).join(" · ") || "-"],
    ["状态", ev.status_code ? `HTTP ${ev.status_code}` : "-"],
    ["Service Tier", ev.service_tier || "-"],
    ["Reasoning Effort", ev.reasoning_effort || "-"],
    ["耗时", `TTFT ${duration(ev.ttft_ms)} · 总 ${duration(ev.latency_ms)}`],
    ["计价", `${sourceLabel(breakdown.source)} · ${breakdown.model || ev.model || "-"}`],
    ["计入额度", pending ? "待核算，Key 已冻结" : quotaLabel]
  ];
  return `<div class="calc">
      ${rows.join("")}
      <div class="calc-note num">其中思考 ${num(reasoning)} · 可见输出约 ${num(visible)}</div>
      <div class="calc-total"><span>合计</span><span class="num">${pending ? "待核算" : money(costs.total ?? ev.cost, 4)}</span></div>
    </div>
    <dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd class="num">${esc(v)}</dd>`).join("")}</dl>
    ${pending ? `<p class="pending-note">${esc(reasonText(billingPendingReason(ev)))}，费用待核算。</p>` : ""}
    ${ev.failed ? `<div class="failure num">${esc(ev.failure || "无失败详情")}</div>` : ""}`;
}
function domId(id){
  return String(id).replace(/[^a-zA-Z0-9_-]/g, "_");
}
function lineHTML(ev, id, open){
  const usage = ev.usage || {};
  const pending = billingPending(ev);
  const input = Number(usage.input_tokens || 0);
  const cached = Number(usage.cached_tokens || 0) + Number(usage.cache_read_tokens || 0);
  const cachePct = input > 0 && cached > 0 ? Math.round(Math.min(cached / input, 1) * 100) : null;
  const meta = [ev.reasoning_effort, ev.service_tier && ev.service_tier !== "default" ? ev.service_tier : ""].filter(Boolean).join(" · ");
  const sub = ev.failed
    ? (ev.failure || "请求失败")
    : [`${num(usage.total_tokens)} tok`, cachePct != null ? `缓存 ${cachePct}%` : "", duration(ev.latency_ms)].filter(Boolean).join(" · ");
  const cost = Number(ev.cost || 0);
  const amount = pending
    ? `<b class="stamp stamp-pending">待核算</b>`
    : `<span class="line-amt num${cost === 0 ? " is-zero" : ""}">${money(cost, 4)}</span>`;
  const detailId = `d-${domId(id)}`;
  return `<li class="line${ev.failed ? " is-failed" : ""}${open ? " is-open" : ""}">
    <button class="line-main" type="button" data-event="${esc(id)}" aria-expanded="${open}" aria-controls="${detailId}">
      <span class="line-time num">${esc(clock(new Date(ev.requested_at)))}</span>
      <span class="line-what"><span class="line-model">${esc(modelOf(ev))}</span>${ev.failed ? `<b class="line-fail">失败${ev.status_code ? " " + esc(ev.status_code) : ""}</b>` : ""}${meta ? `<span class="line-meta">${esc(meta)}</span>` : ""}</span>
      <span class="line-cost">${amount}</span>
      <span class="line-sub${ev.failed ? "" : " num"}">${esc(sub)}</span>
      <svg class="line-chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.25l4 4 4-4"/></svg>
    </button>
    ${open ? `<div class="line-detail" id="${detailId}">${eventDetail(ev)}</div>` : ""}
  </li>`;
}
function filteredEvents(){
  return state.events.filter(ev => (state.filter !== "failed" || ev.failed) && (!state.model || modelOf(ev) === state.model));
}
function reconcile(container, items, animate){
  const keep = new Set(items.map(item => item.key));
  const existing = new Map();
  Array.from(container.children).forEach(el => existing.set(el.dataset.key, el));
  const active = document.activeElement;
  const activeKey = active && container.contains(active) ? (active.closest("[data-key]") || {}).dataset?.key : "";
  const tpl = document.createElement("template");
  const build = (item) => {
    tpl.innerHTML = item.html.trim();
    const el = tpl.content.firstElementChild;
    el.dataset.key = item.key;
    el.dataset.sig = item.sig;
    return el;
  };
  let cursor = container.firstElementChild;
  for (const item of items) {
    while (cursor && !keep.has(cursor.dataset.key)) {
      const next = cursor.nextElementSibling;
      cursor.remove();
      cursor = next;
    }
    let el = existing.get(item.key);
    if (el && el.dataset.sig !== item.sig) {
      const next = build(item);
      if (el === cursor) cursor = next;
      el.replaceWith(next);
      el = next;
    } else if (!el) {
      el = build(item);
      if (animate && item.fresh) el.classList.add("is-fresh");
    }
    if (el === cursor) cursor = cursor.nextElementSibling;
    else container.insertBefore(el, cursor);
  }
  while (cursor) {
    const next = cursor.nextElementSibling;
    cursor.remove();
    cursor = next;
  }
  if (activeKey && (!document.activeElement || document.activeElement === document.body)) {
    const target = container.querySelector(`[data-key="${CSS.escape(activeKey)}"] .line-main`);
    if (target) target.focus({preventScroll: true});
  }
}
function renderRoll(animate=false){
  const range = primaryRange();
  const list = filteredEvents();
  const shown = list.slice(0, state.visible);
  const failedTotal = state.events.filter(ev => ev.failed).length;
  const moreOlder = !state.olderExhausted && state.events.length >= EVENTS_LIMIT;
  $("rollScope").textContent = `${rangeLabel(range)} · ${num(state.events.length)}${moreOlder ? "+" : ""} 条请求`;
  $("failedCount").textContent = failedTotal ? ` ${failedTotal}` : "";
  document.querySelectorAll("[data-filter]").forEach(btn => btn.setAttribute("aria-pressed", String(btn.dataset.filter === state.filter)));
  renderModelOptions();
  $("rollNotice").textContent = [state.errors.usage, state.errors.older].filter(Boolean).join(" ");
  const items = [];
  let lastDay = "";
  for (const ev of shown) {
    const d = new Date(ev.requested_at);
    const key = dayKey(d);
    if (key !== lastDay) {
      const label = dayLabel(d);
      items.push({key:`day:${key}`, sig:label, html:`<li class="day"><h3>${esc(label)}</h3></li>`});
      lastDay = key;
    }
    const id = eventID(ev);
    const open = state.expandedEvents.has(id);
    items.push({key:`ev:${id}`, sig:signature([eventSig(ev), open]), html:lineHTML(ev, id, open), fresh:state.freshEvents.has(id)});
  }
  if (!items.length) {
    const filtered = state.filter !== "all" || state.model;
    items.push({
      key: filtered ? "empty:filtered" : "empty:none",
      sig: range,
      html: filtered
        ? `<li class="empty">没有符合筛选的请求。<br><button class="btn small" type="button" data-clear-filters>清除筛选</button></li>`
        : `<li class="empty">${esc(rangeLabel(range))}内还没有请求。</li>`
    });
  }
  reconcile($("lines"), items, animate);
  const remaining = list.length - shown.length;
  let foot = "";
  if (remaining > 0) {
    foot = `<span class="num">已显示 ${num(shown.length)} / ${num(list.length)} 条</span><button id="more" class="btn small" type="button">再显示 ${num(Math.min(PAGE_SIZE, remaining))} 条</button>`;
  } else if (moreOlder) {
    foot = `<span class="num">已显示 ${num(shown.length)} 条</span><button id="more" class="btn small" type="button"${state.loadingOlder ? " disabled" : ""}>${state.loadingOlder ? "正在加载…" : "加载更早的记录"}</button>`;
  } else if (shown.length) {
    foot = `<span class="roll-end">以下空白</span>`;
  }
  $("rollFoot").innerHTML = foot;
  $("rollFoot").classList.toggle("hidden", !foot);
  const more = $("more");
  if (more) more.onclick = () => (remaining > 0 ? showMore() : fetchOlder());
}
function renderModelOptions(){
  const select = $("modelFilter");
  const counts = new Map();
  state.events.forEach(ev => counts.set(modelOf(ev), (counts.get(modelOf(ev)) || 0) + 1));
  const models = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  if (state.model && !counts.has(state.model)) models.push([state.model, 0]);
  const sig = signature(models);
  if (select.dataset.sig === sig) return;
  select.dataset.sig = sig;
  select.innerHTML = `<option value="">全部模型</option>` + models.map(([m, c]) => `<option value="${esc(m)}">${esc(m)}（${c}）</option>`).join("");
  select.value = state.model;
}
function showMore(){
  state.visible += PAGE_SIZE;
  renderRoll();
}
function rebuildEvents(){
  state.events = [...state.eventMap.values()].sort((a, b) => new Date(b.requested_at) - new Date(a.requested_at));
}
function pruneToWindow(){
  const hours = primaryRange() === "7d" ? 7 * 24 : 24;
  const cutoff = Date.now() - hours * 3600 * 1000 - 60000;
  for (const [id, ev] of state.eventMap) {
    if (new Date(ev.requested_at).getTime() < cutoff) state.eventMap.delete(id);
  }
}
async function fetchOlder(){
  if (state.loadingOlder || !state.events.length) return;
  state.loadingOlder = true;
  state.errors.older = "";
  renderRoll();
  const range = primaryRange();
  const oldest = state.events[state.events.length - 1];
  const before = Math.floor(new Date(oldest.requested_at).getTime() / 1000);
  try {
    const resp = await api(`/events?range=${encodeURIComponent(range)}&limit=${EVENTS_LIMIT}&before=${before}`);
    const events = resp.events || [];
    let added = 0;
    for (const ev of events) {
      const id = eventID(ev);
      if (!state.eventMap.has(id)) { state.eventMap.set(id, ev); added += 1; }
      state.seenEvents.add(id);
    }
    if (events.length < EVENTS_LIMIT || added === 0) state.olderExhausted = true;
    rebuildEvents();
    state.visible += PAGE_SIZE;
  } catch (e) {
    if (isAuthError(e)) { sessionExpired(e); return; }
    state.errors.older = "加载更早记录失败：" + errorMessage(e);
  } finally {
    state.loadingOlder = false;
  }
  state.freshEvents = new Set();
  renderRoll();
}

/* Sync */
async function fetchMe(seq, signal){
  const meResp = await api("/me", {signal});
  if (seq !== state.seq) return;
  state.me = meResp.me;
  renderBalance();
}
async function fetchUsage(seq, signal){
  const range = primaryRange();
  const [usageResp, eventResp] = await Promise.all([
    api(`/usage?range=${encodeURIComponent(range)}`, {signal}),
    api(`/events?range=${encodeURIComponent(range)}&limit=100`, {signal})
  ]);
  if (seq !== state.seq) return;
  state.usage = usageResp;
  state.errors.usage = "";
  const events = eventResp.events || [];
  const hadSeen = state.seenEvents.size > 0;
  const fresh = new Set();
  if (events.length < EVENTS_LIMIT) {
    state.eventMap = new Map(events.map(ev => [eventID(ev), ev]));
    state.olderExhausted = true;
  } else {
    events.forEach(ev => state.eventMap.set(eventID(ev), ev));
    pruneToWindow();
  }
  events.forEach(ev => {
    const id = eventID(ev);
    if (hadSeen && !state.seenEvents.has(id)) fresh.add(id);
    state.seenEvents.add(id);
  });
  state.freshEvents = fresh;
  rebuildEvents();
  renderBalance();
  renderRoll(true);
}
async function fetchPool(signal){
  if (state.poolUnavailable) return;
  try {
    const resp = await api("/pool", {signal});
    state.pools = Array.isArray(resp.pools) ? resp.pools : (resp.pool ? [resp.pool] : []);
    state.pool = state.pools[0] || null;
  } catch (e) {
    if (isAuthError(e)) throw e;
    if (isMissingRoute(e)) state.poolUnavailable = true;
  }
  renderBalance();
}
async function fetchTrend(signal){
  if (state.trendUnavailable) return;
  const range = primaryRange();
  try {
    const resp = await api(`/trend?range=${encodeURIComponent(range)}&tz_offset=${new Date().getTimezoneOffset()}`, {signal});
    state.trend = resp.trend || null;
    state.trendFetchedAt = Date.now();
  } catch (e) {
    if (isAuthError(e)) throw e;
    if (isMissingRoute(e)) state.trendUnavailable = true;
  }
  renderTrend();
}
async function refreshActive(force=false){
  if (!state.active) return;
  if (!force && document.hidden && !state.pip) return;
  if (state.refreshing) {
    if (!force) return;
    cancelRefresh();
  }
  state.refreshing = true;
  const seq = ++state.seq;
  const controller = new AbortController();
  state.controller = controller;
  state.timeoutTimer = setTimeout(() => {
    if (seq === state.seq && state.refreshing) controller.abort("refresh_timeout");
  }, 12000);
  const startedAt = performance.now();
  markRefreshStart(force);
  try {
    await fetchMe(seq, controller.signal);
    let partial = false;
    const trendDue = force || !state.trendFetchedAt || Date.now() - state.trendFetchedAt > 60000;
    await Promise.all([
      fetchPool(controller.signal),
      CARD_MODE ? Promise.resolve() : fetchUsage(seq, controller.signal).catch(e => {
        if (isRefreshCancel(controller.signal)) return;
        if (isAuthError(e)) throw e;
        partial = true;
        state.errors.usage = "用量同步失败：" + errorMessage(e);
        renderRoll();
      }),
      trendDue && !CARD_MODE ? fetchTrend(controller.signal) : Promise.resolve()
    ]);
    await refreshMinimumDelay(force, startedAt);
    if (seq !== state.seq) return;
    if (partial) {
      if (force) setRefreshState("error", "部分失败");
      setLive("warn", "部分数据同步失败");
    } else {
      markRefreshDone(force);
    }
  } catch(e) {
    await refreshMinimumDelay(force, startedAt);
    if (seq === state.seq) {
      if (isAuthError(e)) sessionExpired(e);
      else markRefreshError(force);
    }
  } finally {
    if (seq === state.seq) {
      state.refreshing = false;
      state.controller = null;
      clearRefreshTimeout();
    }
  }
}
function schedule(){
  clearInterval(state.timer);
  state.timer = setInterval(() => refreshActive(false), CARD_MODE ? 30000 : 5000);
}

/* Session */
function resetData(){
  state.me = null;
  state.usage = null;
  state.trend = null;
  state.trendIndex = -1;
  state.trendFetchedAt = 0;
  state.eventMap = new Map();
  state.events = [];
  state.olderExhausted = false;
  state.visible = PAGE_SIZE;
  state.expandedEvents = new Set();
  state.seenEvents = new Set();
  state.freshEvents = new Set();
  state.errors = {usage:"", older:""};
  state.lastSync = 0;
  state.pool = null;
  state.pools = [];
  $("lines").innerHTML = "";
  $("card").innerHTML = "";
}
function showLogin(message){
  clearInterval(state.timer);
  state.active = false;
  if (state.pip) { state.pip.close(); state.pip = null; }
  $("boot").classList.add("hidden");
  $("app").classList.add("hidden");
  $("card").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("err").textContent = message || "";
  $("key").focus();
}
function enterApp(){
  state.active = true;
  $("boot").classList.add("hidden");
  $("login").classList.add("hidden");
  $(CARD_MODE ? "card" : "app").classList.remove("hidden");
  setLive("info", "正在同步");
  renderBalance();
  renderRoll();
  refreshActive(true);
  schedule();
}
function sessionExpired(e){
  cancelRefresh();
  resetData();
  showLogin(errorMessage(e, "会话已过期，请重新登录。"));
}
async function loginNow(){
  $("err").textContent = "";
  const raw = enteredKey();
  const hint = localKeyHint(raw);
  if (hint) { $("err").textContent = "登录失败：" + hint; return; }
  const btn = $("loginBtn");
  btn.disabled = true;
  btn.textContent = "登录中…";
  try {
    const resp = await api("/session", {headers:{"X-CPA-Key-Policy-Plus-Key": raw}});
    try { sessionStorage.removeItem(LOGGED_OUT_FLAG); } catch (_) {}
    $("key").value = "";
    resetData();
    state.me = resp.me || null;
    enterApp();
  } catch(e) {
    $("err").textContent = "登录失败：" + ((e.data || {}).message || e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "登录";
  }
}
async function logoutNow(){
  cancelRefresh();
  clearInterval(state.timer);
  try { sessionStorage.setItem(LOGGED_OUT_FLAG, "1"); } catch (_) {}
  try { await api("/logout"); } catch (_) {}
  resetData();
  showLogin("已退出。");
}
async function boot(){
  let loggedOut = false;
  try { loggedOut = sessionStorage.getItem(LOGGED_OUT_FLAG) === "1"; } catch (_) {}
  if (loggedOut) { showLogin(); return; }
  try {
    const resp = await api("/me");
    state.me = resp.me;
    enterApp();
  } catch (e) {
    showLogin(isAuthError(e) ? "" : "暂时连不上用量服务，请稍后刷新。");
  }
}

$("loginForm").addEventListener("submit", (e) => { e.preventDefault(); loginNow(); });
$("refresh").onclick = () => refreshActive(true);
$("logout").onclick = logoutNow;
$("pin").onclick = pinCard;
$("card").addEventListener("click", (e) => { if (e.target.closest("[data-card-refresh]")) refreshActive(true); });
if (CARD_MODE) {
  document.body.classList.add("kp-card-mode");
  document.title = "用量小票 · CPA";
}
if (!CARD_MODE && window.matchMedia && matchMedia("(pointer: fine)").matches) $("pin").classList.remove("hidden");
$("lines").addEventListener("click", (e) => {
  const clear = e.target.closest("[data-clear-filters]");
  if (clear) {
    state.filter = "all";
    state.model = "";
    state.visible = PAGE_SIZE;
    renderRoll();
    return;
  }
  const btn = e.target.closest("[data-event]");
  if (!btn) return;
  const id = btn.getAttribute("data-event");
  if (state.expandedEvents.has(id)) state.expandedEvents.delete(id); else state.expandedEvents.add(id);
  state.freshEvents = new Set();
  renderRoll();
});
document.querySelectorAll("[data-filter]").forEach(btn => btn.addEventListener("click", () => {
  state.filter = btn.dataset.filter;
  state.visible = PAGE_SIZE;
  state.freshEvents = new Set();
  renderRoll();
}));
$("modelFilter").addEventListener("change", (e) => {
  state.model = e.target.value;
  state.visible = PAGE_SIZE;
  state.freshEvents = new Set();
  renderRoll();
});
$("trendPlot").addEventListener("pointermove", (e) => {
  const t = state.trend;
  if (!t || !t.buckets || !t.buckets.length) return;
  const rect = e.currentTarget.getBoundingClientRect();
  setTrendIndex(Math.floor((e.clientX - rect.left) / rect.width * t.buckets.length), true);
});
$("trendPlot").addEventListener("pointerleave", () => setTrendIndex(state.trend ? state.trend.buckets.length - 1 : 0, false));
$("trendPlot").addEventListener("keydown", (e) => {
  const t = state.trend;
  if (!t || !t.buckets) return;
  const moves = {ArrowLeft: -1, ArrowRight: 1};
  if (e.key in moves) setTrendIndex(state.trendIndex + moves[e.key], true);
  else if (e.key === "Home") setTrendIndex(0, true);
  else if (e.key === "End") setTrendIndex(t.buckets.length - 1, true);
  else return;
  e.preventDefault();
});
$("trendPlot").addEventListener("blur", () => $("trendPlot").classList.remove("is-scrubbing"));
window.addEventListener("resize", fitBalance);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    if (state.refreshing && !state.pip) cancelRefresh();
    return;
  }
  if (state.active) refreshActive(true);
});
window.addEventListener("pageshow", (e) => { if (e.persisted && state.active) refreshActive(true); });
window.addEventListener("focus", () => { if (state.active && Date.now() - state.lastSync > 3000) refreshActive(true); });
boot();
</script>
